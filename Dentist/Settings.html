<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dentist Account Settings</title>
    <!-- Load Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* Custom Theme Colors */
        .bg-primary { background-color: #03555E; }
        .text-primary { color: #03555E; }
        .hover\:bg-primary-dark:hover { background-color: #024449; }
        .font-sans { font-family: 'Inter', sans-serif; }

        /* Custom Switch Styling (Simulating shadcn/ui switch) */
        .custom-switch {
            @apply w-11 h-6 flex items-center rounded-full cursor-pointer transition-colors duration-200;
            background-color: #e5e7eb; /* gray-200 */
        }
        .custom-switch.checked {
            @apply bg-primary;
        }
        .custom-switch-thumb {
            @apply w-5 h-5 bg-white rounded-full shadow transition-transform duration-200 transform;
        }
        .custom-switch.checked .custom-switch-thumb {
            transform: translateX(1.25rem); /* 20px */
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 font-sans">

    <!-- Header -->
    <header class="bg-primary text-white shadow-xl">
        <div class="container mx-auto px-4 py-4 flex items-center gap-4">
            <!-- Back Button Link -->
            <a href="Dashboard.html">
                <button class="inline-flex items-center justify-center rounded-lg font-medium transition-colors duration-200 px-3 py-1.5 text-xs bg-transparent text-white hover:bg-primary-dark">
                    <i data-lucide="arrow-left" class="w-4 h-4 mr-2"></i>
                    Back
                </button>
            </a>
            <div>
                <h1 class="text-xl font-bold">Settings</h1>
                <p class="text-sm opacity-90">Manage your account preferences</p>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto space-y-6">

            <!-- 1. Notification Settings Card -->
            <div class="rounded-xl border bg-white shadow-lg">
                <div class="p-6 border-b">
                    <h2 class="text-lg font-semibold tracking-tight flex items-center gap-2 text-gray-800">
                        <i data-lucide="bell" class="w-5 h-5 text-primary"></i>
                        Notifications
                    </h2>
                </div>
                <div class="p-6">
                    <div class="space-y-4" id="notifications-settings">
                        <!-- Content will be generated by JS -->
                    </div>
                </div>
            </div>

            <!-- 2. Privacy & Security Card -->
            <div class="rounded-xl border bg-white shadow-lg">
                <div class="p-6 border-b">
                    <h2 class="text-lg font-semibold tracking-tight flex items-center gap-2 text-gray-800">
                        <i data-lucide="shield" class="w-5 h-5 text-primary"></i>
                        Privacy & Security
                    </h2>
                </div>
                <div class="p-6">
                    <div class="space-y-4" id="security-settings">
                        <!-- Content will be generated by JS -->
                    </div>
                </div>
            </div>
            
            <!-- 3. Appearance Card -->
            <div class="rounded-xl border bg-white shadow-lg">
                <div class="p-6 border-b">
                    <h2 class="text-lg font-semibold tracking-tight flex items-center gap-2 text-gray-800">
                        <i data-lucide="moon" class="w-5 h-5 text-primary"></i>
                        Appearance
                    </h2>
                </div>
                <div class="p-6">
                    <div class="space-y-4" id="appearance-settings">
                        <!-- Content will be generated by JS -->
                    </div>
                </div>
            </div>

        </div>
    </main>
    
    <!-- Hidden Message Box (for feedback) -->
    <div id="feedback-message" class="hidden fixed bottom-4 right-4 bg-green-600 text-white p-4 rounded-lg shadow-xl transition-opacity duration-300 opacity-0 z-50">
        <!-- Message content injected here -->
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- STATE MANAGEMENT (SIMULATED) ---
        let settingsState = {
            emailNotifications: true,
            smsNotifications: false,
            pushNotifications: true,
            twoFactorAuth: false,
            patientDataPrivacy: true,
            darkMode: false,
            language: 'English'
        };

        const preferenceMap = [
            // Notifications
            { id: 'emailNotifications', group: 'notifications-settings', type: 'switch', title: 'Email Notifications', description: 'Receive appointment reminders via email' },
            { id: 'smsNotifications', group: 'notifications-settings', type: 'switch', title: 'SMS Notifications', description: 'Get text message reminders' },
            { id: 'pushNotifications', group: 'notifications-settings', type: 'switch', title: 'Push Notifications', description: 'Browser notifications for updates' },

            // Privacy & Security
            { id: 'twoFactorAuth', group: 'security-settings', type: 'button-toggle', title: 'Two-Factor Authentication', description: 'Add extra security to your account', buttonText: 'Enable', buttonToggleText: 'Disable' },
            { id: 'patientDataPrivacy', group: 'security-settings', type: 'switch', title: 'Patient Data Privacy', description: 'Control access to patient information' },
            { id: 'changePassword', group: 'security-settings', type: 'button-full', title: 'Change Password', buttonText: 'Change Password', icon: 'lock' },

            // Appearance
            { id: 'darkMode', group: 'appearance-settings', type: 'switch', title: 'Dark Mode', description: 'Switch to dark theme' },
            { id: 'language', group: 'appearance-settings', type: 'button-value', title: 'Language', description: 'Choose your preferred language', buttonText: 'English' },
        ];


        // --- UTILITY FUNCTIONS ---
        function showFeedback(message, isError = false) {
            const feedbackBox = document.getElementById('feedback-message');
            feedbackBox.textContent = message;
            
            feedbackBox.classList.remove('hidden', 'bg-green-600', 'bg-red-600');
            feedbackBox.classList.add(isError ? 'bg-red-600' : 'bg-green-600');
            
            feedbackBox.classList.add('opacity-100');
            
            setTimeout(() => {
                feedbackBox.classList.remove('opacity-100');
                setTimeout(() => {
                    feedbackBox.classList.add('hidden');
                }, 300); 
            }, 2500);
        }

        function handleSwitchToggle(id) {
            const currentState = settingsState[id];
            settingsState[id] = !currentState;
            
            renderSettings(); // Re-render all switches to update state visually
            
            const action = settingsState[id] ? 'enabled' : 'disabled';
            const readableTitle = preferenceMap.find(p => p.id === id).title;
            showFeedback(`${readableTitle} has been ${action}.`);
        }

        function handleButtonClick(id) {
            const item = preferenceMap.find(p => p.id === id);
            
            if (id === 'changePassword') {
                showFeedback(`Redirecting to ${item.buttonText} screen...`);
                return;
            } 
            
            if (id === 'twoFactorAuth') {
                settingsState[id] = !settingsState[id];
                renderSettings();
                const action = settingsState[id] ? 'enabled' : 'disabled';
                showFeedback(`Two-Factor Authentication ${action}.`);
                return;
            }
            
            if (id === 'language') {
                // Simplified language selector: always sets to Spanish on click
                const newLang = settingsState.language === 'English' ? 'Spanish' : 'English';
                settingsState.language = newLang;
                renderSettings();
                showFeedback(`Language set to ${newLang}.`);
                return;
            }

            // Default feedback for other buttons
            showFeedback(`Action for ${item.title} triggered.`);
        }

        // --- RENDER LOGIC ---
        function renderSettings() {
            // Clear existing content
            document.getElementById('notifications-settings').innerHTML = '';
            document.getElementById('security-settings').innerHTML = '';
            document.getElementById('appearance-settings').innerHTML = '';

            preferenceMap.forEach(item => {
                const container = document.getElementById(item.group);
                
                let html = '';

                if (item.type === 'switch') {
                    const isChecked = settingsState[item.id];
                    html = `
                        <div class="flex items-center justify-between border-b last:border-b-0 py-2">
                            <div>
                                <h3 class="font-medium text-gray-800">${item.title}</h3>
                                <p class="text-sm text-gray-600">${item.description}</p>
                            </div>
                            <div id="switch-${item.id}" 
                                class="custom-switch ${isChecked ? 'checked' : ''}"
                                onclick="handleSwitchToggle('${item.id}')">
                                <div class="custom-switch-thumb"></div>
                            </div>
                        </div>
                    `;
                } else if (item.type === 'button-toggle') {
                    const isEnabled = settingsState[item.id];
                    html = `
                        <div class="flex items-center justify-between border-b last:border-b-0 py-2">
                            <div>
                                <h3 class="font-medium text-gray-800">${item.title}</h3>
                                <p class="text-sm text-gray-600">${item.description}</p>
                            </div>
                            <button id="btn-${item.id}"
                                onclick="handleButtonClick('${item.id}')"
                                class="inline-flex items-center justify-center rounded-lg font-medium transition-colors duration-200 px-3 py-1.5 text-sm border 
                                ${isEnabled ? 'bg-primary text-white hover:bg-primary-dark' : 'border-gray-300 hover:bg-gray-100 bg-transparent text-gray-700'}"
                                >
                                ${isEnabled ? item.buttonToggleText : item.buttonText}
                            </button>
                        </div>
                    `;
                } else if (item.type === 'button-value') {
                    html = `
                        <div class="flex items-center justify-between border-b last:border-b-0 py-2">
                            <div>
                                <h3 class="font-medium text-gray-800">${item.title}</h3>
                                <p class="text-sm text-gray-600">${item.description}</p>
                            </div>
                            <button id="btn-${item.id}"
                                onclick="handleButtonClick('${item.id}')"
                                class="inline-flex items-center justify-center rounded-lg font-medium transition-colors duration-200 px-3 py-1.5 text-sm border border-gray-300 hover:bg-gray-100 bg-transparent text-gray-700"
                                >
                                ${settingsState[item.id]}
                            </button>
                        </div>
                    `;
                } else if (item.type === 'button-full') {
                    html = `
                        <div class="pt-2">
                            <button id="btn-${item.id}"
                                onclick="handleButtonClick('${item.id}')"
                                class="inline-flex items-center justify-center rounded-lg font-medium transition-colors duration-200 w-full py-2.5 text-sm border border-gray-300 hover:bg-gray-100 bg-transparent text-gray-700"
                                >
                                <i data-lucide="${item.icon}" class="w-4 h-4 mr-2"></i>
                                ${item.buttonText}
                            </button>
                        </div>
                    `;
                }
                
                if (html) {
                    // Use a temporary div to append elements safely and handle Lucide icons
                    const tempDiv = document.createElement('div');
                    tempDiv.innerHTML = html.trim();
                    container.appendChild(tempDiv.firstChild);
                }
            });
            
            // Re-render Lucide icons for dynamically added content
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }


        // --- INITIALIZATION ---
        window.onload = function() {
            renderSettings();

            // Render Lucide icons for static header elements
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        };
    </script>
</body>
</html>
