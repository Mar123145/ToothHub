async function loadNotifications() {
    // Small delay for rendering
    await new Promise(r => setTimeout(r, 100));

    // Get bell container
    const bellContainer = document.getElementById('bellContainer');
    if (!bellContainer) return console.warn("Bell icon container not found");

    const bellIcon = bellContainer.querySelector('svg, i'); // after lucide, it becomes SVG
    // Attach click to the container so clicks on padding also work
    if (!bellIcon) console.warn("Bell icon not found (icon may render later)");

    const userId = localStorage.getItem('userAccountId') || localStorage.getItem('userId');
    if (!userId) return;

    // Fetch unread notifications
    const { data: notifications, error } = await supabaseClient
    .from('Notifications')
    .select(`
        NotificationID,
        Message,
        Status,
        DateSent,
        AppointmentID,
        Appointment:AppointmentID (
        AppointmentID,
        UserAccountID,
        User:UserAccountID (FirstName, LastName)
        )
    `)
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread')
    .order('DateSent', { ascending: false });

    if (error) return console.error(error);

    // Remove previous badge if exists
    const existingBadge = document.getElementById('notif-badge');
    if (existingBadge) existingBadge.remove();

    if (notifications.length > 0) {
        const badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = notifications.length;
        badge.className = 'absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full';
        bellContainer.appendChild(badge);
    }

    // Remove previous dropdown if exists
    const prevDropdown = document.getElementById('notif-dropdown');
    if (prevDropdown) prevDropdown.remove();

    bellContainer.onclick = async () => {
        let dropdown = document.getElementById('notif-dropdown');
        if (dropdown) return dropdown.remove();

        dropdown = document.createElement('div');
        dropdown.id = 'notif-dropdown';
        dropdown.className = 'absolute right-0 top-[48px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50';
        dropdown.style.maxHeight = '320px';

        if (!notifications || notifications.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'p-4 text-gray-500 text-sm';
            emptyMsg.textContent = 'No new notifications';
            dropdown.appendChild(emptyMsg);
        } else {
            notifications.forEach(n => {
                const item = document.createElement('div');
                item.className = 'px-4 py-3 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer text-sm text-gray-700';

                const first = n.Appointment?.User?.FirstName ?? '';
                const last  = n.Appointment?.User?.LastName ?? '';
                const patientName = `${first} ${last}`.trim() || 'Unknown Patient';

                const originalMsg = n.Message || `You have a new approved appointment for patient ${patientName}`;
                item.textContent = originalMsg.replace(/patient\s*ID\s*[a-f0-9-]{8,}/i, `patient ${patientName}`);

                dropdown.appendChild(item);
            });
        }

        bellContainer.style.position = 'relative';
        bellContainer.appendChild(dropdown);
    };
}

async function logout() {
  await supabaseClient.auth.signOut();
  localStorage.clear();
  window.location.href = "/Login.html";
}




let isEditing = false;
const editToggleBtn = document.getElementById('editToggleBtn');

function setInputsDisabled(disabled) {
    console.log(`🔒 Setting inputs disabled=${disabled}`);
    inputs.forEach(i => {
        i.disabled = disabled;
        if(disabled) i.classList.add('input-disabled');
        else i.classList.remove('input-disabled');
    });
}

let currentUser = null;

async function checkAuth(redirect = true) {
    console.log("🔍 Running checkAuth...");

    const storedFirstName = localStorage.getItem('userFirstName');
    const storedRole = localStorage.getItem('userRole');
    const storedEmail = localStorage.getItem('userEmail');
    const storedId = localStorage.getItem('userId');

    console.log("📦 LocalStorage check:", { storedFirstName, storedRole, storedEmail, storedId });

    if (storedFirstName && storedRole && storedId) {
        console.log("✅ Using cached user info from localStorage");
        return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail, UserAccountID: storedId };
    }

    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    console.log("🔑 Supabase session:", session);
    if (sessionError) console.error("❌ Session error:", sessionError);

    if (!session?.user) {
        console.warn("⚠️ No authenticated user found.");
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    const userId = session.user.id;
    console.log("🆔 Fetching user from Supabase using UserAccountID:", userId);

    // Fetch user by ID instead of Email
    const { data: userData, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('UserAccountID', userId)
        .maybeSingle();

    if (error || !userData) {
        console.error("❌ Failed to fetch user data:", error || "No user data found");
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    // Save to localStorage for future use
    localStorage.setItem('userFirstName', userData.FirstName);
    localStorage.setItem('userRole', userData.Role);
    localStorage.setItem('userEmail', userData.Email || '');
    localStorage.setItem('userId', userData.UserAccountID);

    console.log("✅ Fetched user info from Supabase:", userData);
    return userData;
}

    if (!storedId) {

        return;
    }
    console.log("🆔 Stored UserAccountID:", storedId);

    const { data: userData, error: userError } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('UserAccountID', storedId)
        .maybeSingle();

    if (userError || !userData) {
        console.error("❌ Failed to fetch user data:", userError);
        return;
    }

    currentUser = userData;
    await loadProfilePhotoFromPath(userData.ProfileImagePath);

    const { data: dentist, error: dentistError } = await supabaseClient

    }
    updateWorkDaysDisplayMode();

document.getElementById("officeEnd")?.addEventListener("change", renderOfficeHoursText);

}

function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

const DAY_ORDER = ["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];

function getSelectedDaysFromSelect() {
  const sel = document.getElementById("workDays");
  if (!sel) return [];
  return Array.from(sel.selectedOptions).map(o => o.value);
}

function setSelectedDaysToSelect(days) {
  const sel = document.getElementById("workDays");
  if (!sel) return;
  const set = new Set(days);
  Array.from(sel.options).forEach(opt => (opt.selected = set.has(opt.value)));
}

function renderWorkDaysPills() {
  const wrap = document.getElementById("workDaysPills");
  const sel = document.getElementById("workDays");
  if (!wrap || !sel) return;

  wrap.innerHTML = "";
  const selected = new Set(getSelectedDaysFromSelect());

  DAY_ORDER.forEach(day => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.dataset.day = day;

    const isOn = selected.has(day);
    btn.className =
      "px-3 py-1.5 rounded-full text-sm border transition " +
      (isOn
        ? "bg-[#03555E] text-white border-[#03555E]"
        : "bg-white text-gray-700 border-gray-200 hover:bg-gray-50");

    btn.textContent = day;

    // Only allow changing when editing
    btn.disabled = !isEditing;
    if (btn.disabled) btn.classList.add("opacity-70", "cursor-default");

    btn.addEventListener("click", () => {
      if (!isEditing) return;
      const nowSelected = new Set(getSelectedDaysFromSelect());
      if (nowSelected.has(day)) nowSelected.delete(day);
      else nowSelected.add(day);

      setSelectedDaysToSelect(Array.from(nowSelected));
      renderWorkDaysPills();
      renderWorkDaysChips(); // keep summary in sync
    });

    wrap.appendChild(btn);
  });
}

function renderWorkDaysChips() {
  const wrap = document.getElementById("workDaysChips");
  if (!wrap) return;

  const selected = getSelectedDaysFromSelect();
  wrap.innerHTML = "";

  if (selected.length === 0) {
    wrap.innerHTML = `<span class="text-sm text-gray-500">No work days set</span>`;
    return;
  }

  // show chips in Mon–Sun order
  const ordered = DAY_ORDER.filter(d => selected.includes(d));
  ordered.forEach(day => {
    const chip = document.createElement("span");
    chip.className = "px-2 py-1 text-xs rounded-full bg-[#03555E]/10 text-[#03555E] font-medium";
    chip.textContent = day;
    wrap.appendChild(chip);
  });
}

function updateWorkDaysDisplayMode() {
  const pills = document.getElementById("workDaysPills");
  const chips = document.getElementById("workDaysChips");
  if (!pills || !chips) return;

  // In edit mode show pills; in view mode show chips
  pills.style.display = isEditing ? "flex" : "none";
  chips.style.display = isEditing ? "none" : "flex";

  renderWorkDaysPills();
  renderWorkDaysChips();
}
function renderOfficeHoursText() {
  const el = document.getElementById("officeHoursText");
  if (!el) return;

  const start = document.getElementById("officeStart")?.value || "";
  const end = document.getElementById("officeEnd")?.value || "";

  el.textContent = (start && end) ? `Office hours: ${start} – ${end}` : "Office hours not set";
}

        BirthDate: document.getElementById('birthDate').value,
        Gender: document.getElementById('gender').value
    }).eq('UserAccountID', currentUser.UserAccountID);

    if (userUpdateError) {
        console.error("❌ Failed to update UserAccount:", userUpdateError);
        return;
    }

    // 2️⃣ Prepare dentist data (WorkDays as CSV, OfficeHours as start-end)
    const dentistData = {
    DentistID: crypto.randomUUID(), // or some UUID generator
    UserAccountID: currentUser.UserAccountID,
    LicenseNumber: document.getElementById('licenseNumber').value,
    WorkDays: Array.from(document.getElementById('workDays').selectedOptions).map(o => o.value).join(','),
    OfficeHours: document.getElementById('officeStart').value + '-' + document.getElementById('officeEnd').value
};

    // 3️⃣ Check if dentist record exists
    const { data: existingDentist, error: fetchDentistError } = await supabaseClient
        .from('Dentist')
        .select('*')
        .eq('UserAccountID', currentUser.UserAccountID)
        .maybeSingle();

    if (fetchDentistError) {
        console.error("❌ Failed to fetch dentist record:", fetchDentistError);
        return;
    }

    // 4️⃣ Insert or update dentist
    if (existingDentist) {
        console.log("✏️ Updating existing dentist profile...");
        const { error: dentistUpdateError } = await supabaseClient
            .from('Dentist')
            .update(dentistData)
            .eq('UserAccountID', currentUser.UserAccountID);

        if (dentistUpdateError) {
            console.error("❌ Failed to update dentist:", dentistUpdateError);
            return;
        }
    } else {
        console.log("➕ Creating new dentist profile...");
        const { error: dentistInsertError } = await supabaseClient
            .from('Dentist')
            .insert([dentistData]);

        if (dentistInsertError) {
            console.error("❌ Failed to insert dentist:", dentistInsertError);
            return;
        }
    }

    return showMessage("✅ Profile saved successfully!", "success");
    await loadProfile();
}
editToggleBtn.addEventListener('click', async () => {
    console.log("✏️ Edit button clicked. isEditing:", isEditing);
    isEditing = !isEditing;
    setInputsDisabled(!isEditing);
    updateWorkDaysDisplayMode();

    editIcon.classList.toggle('hidden');
    saveIcon.classList.toggle('hidden');
    editButtonText.textContent = isEditing ? 'Save' : 'Edit';

    if(!isEditing) await saveProfile();
});

function setProfileImage(url) {
  const img = document.getElementById("profileImg");
  const icon = document.getElementById("profileFallbackIcon");
  if (!img || !icon) return;

  if (!url) {
    img.src = "";
    img.classList.add("hidden");
    icon.classList.remove("hidden");
    return;
  }

  img.src = url;
  img.onload = () => {
    img.classList.remove("hidden");
    icon.classList.add("hidden");
  };
  img.onerror = () => {
    img.classList.add("hidden");
    icon.classList.remove("hidden");
  };
}

async function loadProfilePhotoFromPath(path) {
  if (!path) return setProfileImage("");

  const { data, error } = await supabaseClient
    .storage
    .from("Logo")
    .createSignedUrl(path, 60 * 60);

  if (error || !data?.signedUrl) {
    console.error("Signed URL error:", error);
    return setProfileImage("");
  }

  setProfileImage(data.signedUrl);
}

async function uploadProfilePhoto(file) {
  const userAccountId = localStorage.getItem("userId") || localStorage.getItem("userAccountId");
  if (!userAccountId) throw new Error("Missing userId in localStorage");

  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${userAccountId}/profile_${Date.now()}.${ext}`;

  const { error: upErr } = await supabaseClient
    .storage
    .from("Logo")
    .upload(path, file, {
      upsert: true,
      contentType: file.type || "image/*"
    });

  if (upErr) throw upErr;

  // Save path to UserAccount table (you created this column)
  const { error: dbErr } = await supabaseClient
    .from("UserAccount")
    .update({ ProfileImagePath: path })
    .eq("UserAccountID", userAccountId);

  if (dbErr) throw dbErr;

  // Return a signed URL for immediate display
  const { data: signed, error: signErr } = await supabaseClient
    .storage
    .from("Logo")
    .createSignedUrl(path, 60 * 60);

  if (signErr || !signed?.signedUrl) throw (signErr || new Error("No signed URL"));

  return signed.signedUrl;
}


document.addEventListener('DOMContentLoaded', async () => {
    console.log("📄 DOM ready");
    try {
        await checkAuth(false);
        try { lucide.createIcons(); } catch(e) {}
        try { loadNotifications(); } catch(e) {}
        await loadProfile();
    } catch(err) {
        console.error("❌ Error initializing profile page:", err);
    }

      document.getElementById("btnChangePhoto")?.addEventListener("click", () => {
      document.getElementById("profileFileInput")?.click();
      });

      document.getElementById("profileFileInput")?.addEventListener("change", async (e) => {
        const file = e.target.files?.[0];
        if (!file) return;

        if (file.size > 2 * 1024 * 1024) {
          showMessage("❌ Max file size is 2MB.", "error");
          e.target.value = "";
          return;
        }

        try {
          showMessage("Uploading photo...", "success");
          const url = await uploadProfilePhoto(file);
          setProfileImage(url);
          showMessage("✅ Profile photo updated!", "success");
        } catch (err) {
          console.error(err);
          showMessage("❌ Upload failed. Check Logo bucket policies.", "error");
        } finally {
          e.target.value = "";
        }
      });

});
