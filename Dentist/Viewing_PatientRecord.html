    function showMessage(message, type = "error") {
      const box = document.getElementById("messageBox");
      if (!box) return;

      box.textContent = message;
      box.classList.remove("hidden", "bg-red-500", "bg-green-500");
      box.classList.add(type === "success" ? "bg-green-500" : "bg-red-500");
      box.style.opacity = "1";

      setTimeout(() => {
        box.style.opacity = "0";
        setTimeout(() => box.classList.add("hidden"), 250);
      }, 3500);
    }

    // --- Auth ---
    async function checkAuth(requiredRole = null, redirect = true) {
      let storedRole = localStorage.getItem('userRole');
      let storedUserId = localStorage.getItem('userId');
      let storedFirstName = localStorage.getItem('userFirstName');

      if (storedRole && storedUserId) {
        if (requiredRole && storedRole !== requiredRole) {
          if (redirect) window.location.href = "/Login.html";
          return null;
        }
        return { Role: storedRole, UserAccountID: storedUserId, FirstName: storedFirstName };
      }

      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session?.user) {
        if (redirect) window.location.href = "/Login.html";
        return null;
      }

      const { data: userData, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('Email', session.user.email)
        .maybeSingle();

      if (error || !userData) {
        if (redirect) window.location.href = "/Login.html";
        return null;
      }

      localStorage.setItem('userFirstName', userData.FirstName);
      localStorage.setItem('userRole', userData.Role);
      localStorage.setItem('userId', userData.UserAccountID);

      if (requiredRole && userData.Role !== requiredRole) {
        if (redirect) window.location.href = "/Login.html";
        return null;
      }

      return { Role: userData.Role, UserAccountID: userData.UserAccountID, FirstName: userData.FirstName };
    }

    // --- Data ---
    async function fetchPatients() {
  const { data, error } = await supabaseClient
    .from('UserAccount')
    .select('*')
    .eq('Role', 'patient')
    .order('FirstName', { ascending: true });

  if (error) {
    console.error('Error fetching patients:', error);
    return [];
  }

  return data.map(p => ({
    id: p.UserAccountID,
    firstName: p.FirstName || '',
    lastName: p.LastName || '',
    email: p.Email || '',
    phone: p.ContactNumber || '',
    lastVisit: p.LastVisit || 'N/A',
  }));
}

    function renderPatientList(patients) {
      let patientListContent;

      if (patients.length === 0) {

          <div class="text-center py-12 text-gray-500">

    // --- Save new patient ---
    async function savePatient(event) {
      event.preventDefault();
      const form = event.target;

      const firstName  = form.firstName.value.trim();
      const middleName = form.middleName.value.trim();
      const lastName   = form.lastName.value.trim();
      const email      = form.email.value.trim();
      const phone      = form.phone.value.trim();
      const dob        = form.birthDate.value;
      const gender     = form.gender.value;

      if (!firstName || !lastName || !email || !phone || !dob || !gender) {
        showMessage('Please fill in all required fields.', 'error');
        return;
      }

      try {
        // check duplicate email
        const { data: existing, error: checkError } = await supabaseClient
          .from('UserAccount')
          .select('UserAccountID')
          .eq('Email', email)
          .maybeSingle();

        if (checkError) throw checkError;
        if (existing) {
          showMessage('A patient with this email already exists.', 'error');
          return;
        }

        const newPatientID = crypto.randomUUID();

        const { data, error } = await supabaseClient
          .from('UserAccount')
          .insert([{
            UserAccountID: newPatientID,
            FirstName: firstName,
            MiddleName: middleName || null,
            LastName: lastName,
            Email: email,
            ContactNumber: phone,
            BirthDate: dob,
            Gender: gender,
            Role: 'patient',
            CreatedAt: new Date().toISOString(),
          }])
          .select();

        if (error) throw error;

        showMessage('Patient added successfully!', 'success');

        // reset form visually
        form.reset();

        // close form + re-render (this will refetch patients)
        setState({ showAddForm: false });

      } catch (err) {
        console.error('Error saving patient:', err);
        showMessage('Error saving patient: ' + err.message, 'error');
      }
    }

    // --- Main render ---
   async function renderApp() {
  await checkAuth();

  const patients = await fetchPatients();

  const normalizedSearchTerm = (state.searchTerm || '').toLowerCase().trim();

  const filteredPatients = patients.filter(p => {
    if (!normalizedSearchTerm) return true; // no search → show all

    const fullName = `${p.firstName} ${p.lastName}`.toLowerCase();
    const email = (p.email || '').toLowerCase();
    const phoneDigits = (p.phone || '').replace(/[^0-9]/g, '');
    const searchDigits = normalizedSearchTerm.replace(/[^0-9]/g, '');

    return (
      fullName.includes(normalizedSearchTerm) ||
      email.includes(normalizedSearchTerm) ||
      (searchDigits && phoneDigits.includes(searchDigits))
    );
  });

  const app = document.getElementById('app-container');
  app.innerHTML = `
    <div class="space-y-6">
      ${renderPatientControls()}
      ${renderAddForm()}
      ${renderPatientList(filteredPatients)}
    </div>
  `;

  // Render Lucide icons (including dynamically injected ones)
  if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
    lucide.createIcons();
  }
  console.log('searchTerm:', state.searchTerm, 'filtered:', filteredPatients.length);


  // wire events
  setupEventListeners();
}


   function setupEventListeners() {
  // toggle add form
  const toggleButton = document.getElementById('toggle-add-form');
  if (toggleButton) {
    toggleButton.onclick = () => setState({ showAddForm: !state.showAddForm });
  }

  const searchInput = document.getElementById('search-input');
  const searchButton = document.getElementById('search-button');

  // Run search when clicking the button
  if (searchButton && searchInput) {
    searchButton.onclick = () => {
      const term = searchInput.value.trim();
      setState({ searchTerm: term });
    };
  }

  // Run search when pressing Enter in the box
  if (searchInput) {
    searchInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const term = searchInput.value.trim();
        setState({ searchTerm: term });
      }
    });
  }
}




    function setState(newState) {
      state = { ...state, ...newState };
      renderApp();
    }

    // Expose savePatient to global scope (for inline onsubmit)
    window.savePatient = savePatient;
    window.setState = setState;

    

async function logout() {
  await supabaseClient.auth.signOut();

}

async function loadNotifications() {
    // Small delay for rendering
    await new Promise(r => setTimeout(r, 100));

    // Get bell container
    const bellContainer = document.getElementById('bellContainer');
    if (!bellContainer) return console.warn("Bell icon container not found");

    const bellIcon = bellContainer.querySelector('svg, i'); // after lucide, it becomes SVG
    // Attach click to the container so clicks on padding also work
    if (!bellIcon) console.warn("Bell icon not found (icon may render later)");

    const userId = localStorage.getItem('userId');
    if (!userId) return;

    // Fetch unread notifications
    const { data: notifications, error } = await supabaseClient
    .from('Notifications')
    .select(`
        NotificationID,
        Message,
        Status,
        DateSent,
        AppointmentID,
        Appointment:AppointmentID (
        AppointmentID,
        UserAccountID,
        User:UserAccountID (FirstName, LastName)
        )
    `)
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread')
    .order('DateSent', { ascending: false });

    if (error) return console.error(error);

    // Remove previous badge if exists
    const existingBadge = document.getElementById('notif-badge');
    if (existingBadge) existingBadge.remove();

    if (notifications.length > 0) {
        const badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = notifications.length;
        badge.className = 'absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full';
        bellContainer.appendChild(badge);
    }

    // Remove previous dropdown if exists
    const prevDropdown = document.getElementById('notif-dropdown');
    if (prevDropdown) prevDropdown.remove();

    bellContainer.onclick = async () => {
        let dropdown = document.getElementById('notif-dropdown');
        if (dropdown) return dropdown.remove();

        dropdown = document.createElement('div');
        dropdown.id = 'notif-dropdown';
        dropdown.className = 'absolute right-0 top-[48px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50';
        dropdown.style.maxHeight = '320px';

        if (!notifications || notifications.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'p-4 text-gray-500 text-sm';
            emptyMsg.textContent = 'No new notifications';
            dropdown.appendChild(emptyMsg);
        } else {
            notifications.forEach(n => {
                const item = document.createElement('div');
                item.className = 'px-4 py-3 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer text-sm text-gray-700';

                const first = n.Appointment?.User?.FirstName ?? '';
                const last  = n.Appointment?.User?.LastName ?? '';
                const patientName = `${first} ${last}`.trim() || 'Unknown Patient';

                const originalMsg = n.Message || `You have a new approved appointment for patient ${patientName}`;
                item.textContent = originalMsg.replace(/patient\s*ID\s*[a-f0-9-]{8,}/i, `patient ${patientName}`);

                dropdown.appendChild(item);
            });
        }

        bellContainer.style.position = 'relative';
        bellContainer.appendChild(dropdown);
    };
}


document.addEventListener('DOMContentLoaded', async () => {
  await renderApp();
  // Render icons for shell + initial page
  if (typeof lucide !== 'undefined' && typeof lucide.createIcons === 'function') {
    lucide.createIcons();
  }
  // load bell notifications (shell)
  if (typeof loadNotifications === "function") loadNotifications();
});
  </script>

</body>
</html>
