<style>
.no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom style for the chart container to ensure responsiveness while maintaining aspect ratio */
        .tooth-chart-container {
            display: grid;
            grid-template-columns: repeat(17, minmax(0, 1fr)); /* 8 + 1 (gap) + 8 */
            gap: 0.25rem;
        }
        .tooth-chart-container > div:nth-child(9) {
            /* Midline separator */
            grid-column: 9 / span 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #d1d5db; /* gray-300 */
        }
        /* Grid for 8 teeth in a quadrant */
        .quadrant-grid {
            display: contents;
        }
        
        /* --- STYLIZED TOOTH SHAPE --- */
        .tooth-shape {
            /* Creates a shape with a very rounded top and a less rounded, more squarish base */
            border-radius: 60% 60% 15% 15% / 60% 60% 15% 15%;
            /* For upper arch, flip the shape vertically */
        }
        .upper-arch .tooth-shape {
             /* Flip upper arch buttons for anatomical correctness */
             transform: scaleY(-1);
             transform-origin: center center;
        }
        
        .tooth-button-inner {
            /* This div reverses the transformation so the content is upright */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .upper-arch .tooth-button-inner {
            transform: scaleY(-1); /* Reverse transform for content */
        }
    </style>

            const storedEmail = localStorage.getItem('userEmail');
            const storedUserId = localStorage.getItem('userId');

            localStorage.setItem('userEmail', userData.Email);

function ToothButton({ number, status, onClick, isUpperArch, isEditing }) {
  const meta = status ? TOOTH_STATUS_META[status] : null;

  const baseBorder = meta?.border || "border-gray-300";
  const isMarked = meta && status !== "Clear";

  return (
    <button
      type="button"
      title={status || "Clear"}
      onClick={(e) => {

        if (!isEditing) return;
        onClick();
      }}
      className={[

        "bg-white transition-all duration-200 shadow-sm",

// --- Tooth Chart Grid Structure (Design Fixed) ---
function ToothChartGrid({ teethStatus, handleToothClick, isEditing }) {
    // Quadrants for Universal Numbering System visualization:
    // Maxillary: Q1 (8->1), Midline, Q2 (9->16)
    // Mandibular: Q4 (32->25), Midline, Q3 (24->17)
    
    // Q1 (Upper Right, Patient Right): 8, 7, 6, 5, 4, 3, 2, 1
    const Q1 = [8, 7, 6, 5, 4, 3, 2, 1];
    // Q2 (Upper Left, Patient Left): 9, 10, 11, 12, 13, 14, 15, 16
    const Q2 = [9, 10, 11, 12, 13, 14, 15, 16];
    // Q4 (Lower Right, Patient Right): 32, 31, 30, 29, 28, 27, 26, 25
    const Q4 = [32, 31, 30, 29, 28, 27, 26, 25];
    // Q3 (Lower Left, Patient Left): 24, 23, 22, 21, 20, 19, 18, 17
    const Q3 = [24, 23, 22, 21, 20, 19, 18, 17];

    const renderQuadrant = (numbers, isUpperArch) => (
        <div className={`quadrant-grid ${isUpperArch ? 'upper-arch' : 'lower-arch'}`}>
            {numbers.map(n => (
                <ToothButton 
                    key={n} 
                    number={n} 
                    status={teethStatus[n]} 
                    onClick={() => handleToothClick(n)} 
                    isUpperArch={isUpperArch}
                    isEditing={isEditing}
                />
            ))}
        </div>
    );

    return (
        <div className="bg-white p-4 rounded-xl border shadow-inner">
            <h4 className="text-center text-xs font-semibold text-gray-500 mb-2 uppercase tracking-widest">Maxillary Arch (Upper)</h4>
            <div className="tooth-chart-container">
                {/* Upper Right Quadrant (Q1) */}
                {renderQuadrant(Q1, true)}
                {/* Midline */}
                <div className="text-sm font-light text-gray-300">|</div>
                {/* Upper Left Quadrant (Q2) */}
                {renderQuadrant(Q2, true)}
            </div>

            <div className="w-full h-1 bg-gray-100 my-4 rounded-full"></div>

            <div className="tooth-chart-container">
                {/* Lower Right Quadrant (Q4) */}
                {renderQuadrant(Q4, false)}
                {/* Midline */}
                <div className="text-sm font-light text-gray-300">|</div>
                {/* Lower Left Quadrant (Q3) */}
                {renderQuadrant(Q3, false)}
            </div>
            <h4 className="text-center text-xs font-semibold text-gray-500 mt-2 uppercase tracking-widest">Mandibular Arch (Lower)</h4>
        </div>
    );
}

function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}


const _signedUrlCache = new Map(); // key -> { url, expAt }

async function getSignedUrlCached(bucket, path, expiresInSeconds = 3600) {
  if (!path) return null;

  const key = `${bucket}:${path}`;
  const now = Date.now();

  const cached = _signedUrlCache.get(key);
  if (cached && cached.expAt > now + 10_000) { // still valid (10s buffer)
    return cached.url;
  }

  const { data, error } = await supabaseClient.storage
    .from(bucket)
    .createSignedUrl(path, expiresInSeconds);

  if (error) {
    console.error(error);
    return null;
  }

  const url = data?.signedUrl || null;
  if (url) _signedUrlCache.set(key, { url, expAt: now + expiresInSeconds * 1000 });
  return url;
}

function createSignaturePad(canvas, opts = {}) {
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const state = {
    drawing: false,
    lastX: 0,
    lastY: 0,
    hasInk: false,
  };

  const settings = {
    lineWidth: opts.lineWidth ?? 2.2,
    lineColor: opts.lineColor ?? "#111",
    background: opts.background ?? "#fff",
  };

  function resizeCanvasToDisplaySize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = settings.lineColor;
    ctx.lineWidth = settings.lineWidth;
  }

  function getPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? e.touches?.[0]?.clientX;
    const clientY = e.clientY ?? e.touches?.[0]?.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(e) {
    e.preventDefault();
    state.drawing = true;
    const p = getPointFromEvent(e);
    state.lastX = p.x;
    state.lastY = p.y;
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
  }

  function draw(e) {
    if (!state.drawing) return;
    e.preventDefault();
    const p = getPointFromEvent(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.lastX = p.x;
    state.lastY = p.y;
    state.hasInk = true;
  }

  function endDraw(e) {
    if (!state.drawing) return;
    e.preventDefault();
    state.drawing = false;
    ctx.closePath();
  }

  function clear() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);
    state.hasInk = false;
  }

  async function loadFromUrl(url) {
    if (!url) return;
    const rect = canvas.getBoundingClientRect();

    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);

    await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(rect.width / img.width, rect.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (rect.width - w) / 2, (rect.height - h) / 2, w, h);
        state.hasInk = true;
        resolve();
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  canvas.addEventListener("pointerdown", startDraw);
  canvas.addEventListener("pointermove", draw);
  window.addEventListener("pointerup", endDraw);
  window.addEventListener("pointercancel", endDraw);

  resizeCanvasToDisplaySize();

  const ro = new ResizeObserver(() => {
    resizeCanvasToDisplaySize();
    state.hasInk = false;
  });
  ro.observe(canvas);

  return {
    clear,
    loadFromUrl,
    hasInk: () => state.hasInk,
    destroy: () => ro.disconnect(),
  };
}

function initConsentSignaturePads() {
  const patientCanvas = document.getElementById("patientSigCanvas");

  if (patientCanvas && !window.patientPad) {

}

// Expose to React
window.openConsentsListForAppointment = async function (appointmentId) {
  const wrap = document.getElementById("consentsListContainer");
  if (!wrap) return showMessage("Consent UI missing.", "error");

  wrap.innerHTML = `<div class="text-gray-600 text-sm">Loading...</div>`;
  showConsentsList();

  const { data, error } = await supabaseClient
    .from("AppointmentConsent")
    .select(`ConsentID, Status, ConsentDate, CreatedAt, ServiceSnapshot, ConsentTitle, TemplateID`)
    .eq("AppointmentID", appointmentId)
    .order("CreatedAt", { ascending: false });

  if (error) {
    console.error(error);
    wrap.innerHTML = `<div class="text-red-600 text-sm">Failed to load consents.</div>`;
    return;
  }

  if (!data || data.length === 0) {
    wrap.innerHTML = `<div class="text-gray-600 text-sm">No consents found.</div>`;
    return;
  }

  wrap.innerHTML = data.map(c => `
    <div class="border rounded-lg p-4 flex items-center justify-between gap-3">
      <div class="min-w-0">
        <div class="font-semibold truncate">
        ${c.ConsentTitle || c.TemplateID|| c.ServiceSnapshot || "Consent"}
        </div>
        <div class="text-sm text-gray-500">
          Status: <span class="font-semibold">${c.Status || "—"}</span>
          • Date: ${c.ConsentDate || "—"}
        </div>
      </div>
      <button class="px-3 py-2 rounded-lg border hover:bg-gray-50 text-sm font-medium"
        onclick="loadConsentById('${c.ConsentID}')">
        Open
      </button>
    </div>
  `).join("");
};

async function loadConsentById(consentId) {
  const { data, error } = await supabaseClient
    .from("AppointmentConsent")
    .select("*")
    .eq("ConsentID", consentId)
    .maybeSingle();

  if (error || !data) {
    console.error(error);
    return showMessage("Failed to open consent.", "error");
  }

  console.log("CONSENT DATA:", data);
  // 1) Close list and show modal immediately (feels instant)
  closeConsentsList();
  showConsentModal();
  lockConsentUI(true); // dentist view-only

  // 2) Fill fields (fast)
  document.getElementById("consentPatientName").value = data.PatientName || "";
  document.getElementById("consentStaffName").value = data.StaffName || "";
  document.getElementById("consentDate").value = data.ConsentDate || "";
  document.getElementById("consentText").value = data.ConsentText || "";
  const statusEl = document.getElementById("consentStatus");
  if (statusEl) statusEl.textContent = data.Status || "—";

  // 3) Show a readable "title" even though template select is disabled
  const title =
    data.ConsentTitle ||
    data.TemplateTitle ||
    data.ServiceSnapshot ||
    "Consent";

  const sel = document.getElementById("consentTemplateSelect");
  if (sel) {
    sel.innerHTML = `<option>${title}</option>`;
    sel.value = title;
  }

  // 4) IMPORTANT: init pads ONLY after modal is visible, so canvases have real size
  requestAnimationFrame(async () => {
    // build pads now that the modal is visible
    initConsentSignaturePads();

    // clear + load signatures
    window.patientPad?.clear();
    window.staffPad?.clear();

    // Use cached signed URLs for speed
    const patientUrl = await getSignedUrlCached("consent-signatures", data.PatientSignaturePath);
    if (patientUrl) await window.patientPad?.loadFromUrl(patientUrl);

    const staffUrl = await getSignedUrlCached("consent-signatures", data.StaffSignaturePath);
    if (staffUrl) await window.staffPad?.loadFromUrl(staffUrl);
  });
}

function getTodayRangePH() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(new Date());

  const y = parts.find(p => p.type === "year")?.value;
  const m = parts.find(p => p.type === "month")?.value;
  const d = parts.find(p => p.type === "day")?.value;

  // Return Date objects (so comparisons work)
  const start = new Date(`${y}-${m}-${d}T00:00:00+08:00`);
  const end   = new Date(`${y}-${m}-${d}T23:59:59.999+08:00`);
  return { start, end };
}


async function loadNotifications() {
    // Small delay for rendering
    await new Promise(r => setTimeout(r, 100));

    // Get bell container
    const bellContainer = document.getElementById('bellContainer');
    if (!bellContainer) return console.warn("Bell icon container not found");

    const bellIcon = bellContainer.querySelector('svg, i'); // after lucide, it becomes SVG
    // Attach click to the container so clicks on padding also work
    if (!bellIcon) console.warn("Bell icon not found (icon may render later)");

    const userId = localStorage.getItem('userId');
    if (!userId) return;

    // Fetch unread notifications
    const { data: notifications, error } = await supabaseClient
    .from('Notifications')
    .select(`
        NotificationID,
        Message,
        Status,
        DateSent,
        AppointmentID,
        Appointment:AppointmentID (
        AppointmentID,
        UserAccountID,
        User:UserAccountID (FirstName, LastName)
        )
    `)
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread')
    .order('DateSent', { ascending: false });

    if (error) return console.error(error);

    // Remove previous badge if exists
    const existingBadge = document.getElementById('notif-badge');
    if (existingBadge) existingBadge.remove();

    if (notifications.length > 0) {
        const badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = notifications.length;
        badge.className = 'absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full';
        bellContainer.appendChild(badge);
    }

    // Remove previous dropdown if exists
    const prevDropdown = document.getElementById('notif-dropdown');
    if (prevDropdown) prevDropdown.remove();

    bellContainer.onclick = async () => {
        let dropdown = document.getElementById('notif-dropdown');
        if (dropdown) return dropdown.remove();

        dropdown = document.createElement('div');
        dropdown.id = 'notif-dropdown';
        dropdown.className = 'absolute right-0 top-[48px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50';
        dropdown.style.maxHeight = '320px';

        if (!notifications || notifications.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'p-4 text-gray-500 text-sm';
            emptyMsg.textContent = 'No new notifications';
            dropdown.appendChild(emptyMsg);
        } else {
            notifications.forEach(n => {
                const item = document.createElement('div');
                item.className = 'px-4 py-3 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer text-sm text-gray-700';

                const first = n.Appointment?.User?.FirstName ?? '';
                const last  = n.Appointment?.User?.LastName ?? '';
                const patientName = `${first} ${last}`.trim() || 'Unknown Patient';

                const originalMsg = n.Message || `You have a new approved appointment for patient ${patientName}`;
                item.textContent = originalMsg.replace(/patient\s*ID\s*[a-f0-9-]{8,}/i, `patient ${patientName}`);

                dropdown.appendChild(item);
            });
        }

        bellContainer.style.position = 'relative';
        bellContainer.appendChild(dropdown);
    };
}
