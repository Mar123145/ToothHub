<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "custom-primary": "#03555E",
              "custom-hover": "#024449",
            },
          },
        },
      };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
    <style>
        /* Custom colors from the original component */
        .bg-\[\#03555E\] { background-color: #03555E; }
        .hover\:bg-\[\#024449\]:hover { background-color: #024449; }

        /* Approximate shadcn/ui styles */
        .card {
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb; /* border-gray-200 */
            background-color: white;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            overflow: hidden; 
        }
        .card-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .card-title {
            font-size: 1.25rem; /* text-xl */
            font-weight: 600; /* font-semibold */
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .card-content {
            padding: 1.5rem;
        }
        .button-style {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            line-height: 1.25;
            font-weight: 500;
            transition: background-color 0.15s;
        }
        .button-ghost {
            background-color: transparent;
            border: none;
        }
        
        /* Filter button styles */
        .filter-group {
            display: flex;
            border-radius: 0.375rem; 
            background-color: #f3f4f6; 
            padding: 0.25rem; 
        }
        .filter-button {
            padding: 0.375rem 0.75rem; 
            border-radius: 0.25rem; 
            font-size: 0.75rem; 
            font-weight: 500;
            transition: background-color 0.2s, color 0.2s;
            white-space: nowrap; 
        }
        .filter-active {
            background-color: #03555E;
            color: white;
            box-shadow: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
        }
        .filter-inactive {
            background-color: transparent;
            color: #4b5563; 
        }
        .filter-inactive:hover {
            background-color: #e5e7eb; 
        }

        /* Notification list items */
        .notification-item {
            position: relative;
            padding: 0.55rem 1rem;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            background-color: white;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 0.25rem; 
        }
        .notification-item:hover {
            border-color: #d1d5db;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.08), 0 1px 2px -1px rgba(0, 0, 0, 0.04);
            transform: translateY(-1px);
        }
        .notification-item.unread {
            background-color: #ffffff;
            border-color: #e5e7eb;
            border-left: 4px solid #03555E; /* accent */
            padding-left: 0.9rem;
        }

        .unread-dot {
            position: absolute;
            left: 10px;
            top: 14px;
            width: 8px;
            height: 8px;
            border-radius: 9999px;
            background: #03555E;
        }
        
        .notification-message {
            font-size: 1rem; /* Increased font size (default text size) */
            font-weight: 500;
            color: #1f2937; 
            line-height: 1.3; /* Tightened line height slightly */
        }
        .notification-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.125rem;
        }
        .notification-date {
            font-size: 0.75rem; /* Increased font size for better readability */
            color: #9ca3af; 
        }
        .notification-status {
            font-size: 0.75rem; /* Increased font size for better readability */
            font-weight: 600;
            text-transform: capitalize;
            padding: 0 0.3rem; 
            border-radius: 0.25rem;
            line-height: 1.5;
        }
        .notification-item.unread .notification-status {
            color: #03555E;
            background-color: rgba(3, 85, 94, 0.10);
        }
        .notification-item.read .notification-status {
            color: #6b7280; 
            background-color: #f3f4f6; 
        }
        /* End Compact Styling */

        /* No notifications message */
        #no-notifications-message {
            background-color: white;
            border-radius: 0.5rem;
            padding: 1.5rem;
            margin-top: 1rem; 
            border: 1px dashed #e5e7eb;
            color: #6b7280;
        }
        #no-notifications-message svg {
            color: #9ca3af;
        }
        #no-notifications-message h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        #no-notifications-message p {
            font-size: 0.875rem;
        }

        /* Load More button */
        #load-more-btn {
            width: 100%;
            padding: 0.625rem 1rem;
            margin-top: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
            border-radius: 0.5rem;
            background-color: #03555E;
            color: white;
            transition: background-color 0.2s ease-in-out;
        }
        #load-more-btn:hover {
            background-color: #024449;
        }

    </style>
</head>

<body class="min-h-screen bg-gray-50">

      <nav class="p-4 space-y-1">

        <a href="Profile.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors"><i class="fa-regular fa-user w-5"></i><span>Profile</span></a>
        <a href="Settings.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors"><i class="fa-solid fa-gear w-5"></i><span>Settings</span></a>
        <div class="pt-3 mt-3 border-t border-white/15"></div>
        <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg bg-red-500 hover:bg-red-600 transition-colors"><i class="fa-solid fa-right-from-bracket w-5"></i><span class="font-medium">Logout</span></button>
      </nav>
    </aside>

    <!-- Main -->
    <main class="flex-1 p-6">
      <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-gray-900">Notifications</h1>
        <p class="text-gray-600 mb-6">Stay updated with your dental care</p>

        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <i class="fa-regular fa-bell text-gray-700"></i>
              Recent Notifications
            </h2>

            <div class="flex items-center gap-2">
              <button id="markAllReadBtn" class="filter-button filter-inactive border border-gray-200 bg-white hover:bg-gray-50">
                Mark all as read
              </button>
              <div class="filter-group">
                <button id="filter-all" class="filter-button filter-active" data-status="">All</button>
                <button id="filter-unread" class="filter-button filter-inactive" data-status="Unread">Unread</button>
                <button id="filter-read" class="filter-button filter-inactive" data-status="Read">Read</button>

          <div class="card-content">
            <div class="text-center py-12 text-gray-500" id="no-notifications-message">
              <i class="fa-regular fa-bell-slash text-5xl opacity-40 mb-4"></i>
              <h3 class="text-lg font-medium mb-2" id="emptyTitle">No notifications</h3>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://xpruhdgniomsyeufwhtm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcnVoZGduaW9tc3lldWZ3aHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1ODU1MDgsImV4cCI6MjA3ODE2MTUwOH0.3obk7zsBdWOty0T_ArDUBAcepOecaeO-duVEG6IthcI"; 
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function checkAuth(redirect = true) {
  // 1️⃣ Try localStorage first
  const storedFirstName = localStorage.getItem('userFirstName');
  const storedRole = localStorage.getItem('userRole');
  const storedEmail = localStorage.getItem('userEmail');

  if (storedFirstName && storedRole) {
    return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail };
  }

  // 2️⃣ Fallback to Supabase session
  const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
  if (sessionError) console.error(sessionError);

  if (!session?.user) {
    if (redirect) window.location.href = "/Login.html";
    return null;
  }

  // 3️⃣ Fetch user info from UserAccount table
  const { data: userData, error } = await supabaseClient
    .from('UserAccount')
    .select('*')
    .eq('Email', session.user.email)
    .maybeSingle();

  if (error || !userData) {
    console.error(error || "No user data found");
    if (redirect) window.location.href = "/Login.html";
    return null;
  }

  // 4️⃣ Save to localStorage
  localStorage.setItem('userFirstName', userData.FirstName);
  localStorage.setItem('userRole', userData.Role);
  localStorage.setItem('userEmail', userData.Email);
  localStorage.setItem('userId', userData.UserAccountID);

  return userData;
}

let currentPage = 1;
const pageSize = 10;
let currentFilter = ''; // '' for All, 'Read', or 'Unread'

function fmtDatePH(iso) {
  if (!iso) return '';
  try {
    return new Date(iso).toLocaleString('en-PH', {
      timeZone: 'Asia/Manila',
      month: 'short',
      day: '2-digit',
      year: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    });
  } catch {
    return String(iso);
  }
}

function setEmptyStateText() {
  const box = document.getElementById('no-notifications-message');
  if (!box) return;
  const title = box.querySelector('h3');
  const desc = box.querySelector('p');
  if (!title || !desc) return;
  if (currentFilter === 'Unread') {
    title.textContent = 'No unread notifications';
    desc.textContent = "You're all caught up.";
  } else if (currentFilter === 'Read') {
    title.textContent = 'No read notifications';
    desc.textContent = 'Read notifications will appear here.';
  } else {
    title.textContent = 'No notifications';
    desc.textContent = "You're all caught up! New notifications will appear here";
  }
}

// Function to update the appearance of filter buttons
function updateFilterButtons(newFilter) {
    document.querySelectorAll('.filter-button').forEach(btn => {
        const btnStatus = btn.getAttribute('data-status');
        if (btnStatus === newFilter) {
            btn.classList.add('filter-active');
            btn.classList.remove('filter-inactive');
        } else {
            btn.classList.remove('filter-active');
            btn.classList.add('filter-inactive');
        }
    });
}

// Function to set up filter button event listeners
function setupFilterListeners() {
    document.querySelectorAll('.filter-button').forEach(button => {
        button.addEventListener('click', (e) => {
            const newFilter = e.currentTarget.getAttribute('data-status');
            if (newFilter !== currentFilter) {
                currentFilter = newFilter;
                currentPage = 1; // Reset to first page
                updateFilterButtons(currentFilter);
                setEmptyStateText();
                loadPatientNotificationsPage(currentPage);
            }
        });
    });
}


async function loadPatientNotificationsPage(page = 1) {
    const user = await checkAuth();
    if (!user) return;

    const userId = localStorage.getItem('userId');
    if (!userId) return;

    // Build the query and apply the filter if currentFilter is set
    let query = supabaseClient
        .from('Notifications')
        .select('*', { count: 'exact' }) // also get total count
        .eq('UserAccountID', userId)
        .order('DateSent', { ascending: false });
    
    if (currentFilter) {
        query = query.eq('Status', currentFilter);
    }
    
    // Apply pagination
    query = query.range((page - 1) * pageSize, page * pageSize - 1);

    // Execute the query
    const { data: notifications, error, count } = await query;

    if (error) {
        console.error('Error fetching notifications:', error);
        return;
    }

    const cardContent = document.querySelector('.card-content');
    const noNotifMessage = document.getElementById('no-notifications-message');
    if (!cardContent || !noNotifMessage) return;

    // Clear content if first page
    if (page === 1) {
        cardContent.innerHTML = ''; // Clear existing items
        cardContent.appendChild(noNotifMessage); // Re-add the message placeholder
        setEmptyStateText();
    }

    if (!notifications || notifications.length === 0) {
        noNotifMessage.style.display = 'block';
        // Remove Load More button if no notifications
        let loadMoreBtn = document.getElementById('load-more-btn');
        if (loadMoreBtn) loadMoreBtn.remove();
        return;
    }
    
    noNotifMessage.style.display = 'none'; // Hide "No notifications" message if there are notifications

    // Populate notifications list
    notifications.forEach(n => {
        const notifItem = document.createElement('div');
        notifItem.className = `notification-item ${n.Status === 'Unread' ? 'unread' : 'read'}`;
        notifItem.setAttribute('data-notification-id', n.NotificationID);
        
		const dateTxt = fmtDatePH(n.DateSent);
		notifItem.innerHTML = `
            ${n.Status === 'Unread' ? '<span class="unread-dot" aria-hidden="true"></span>' : ''}
			<p class="notification-message">${n.Message}</p>
            <div class="notification-meta">
                <span class="notification-date">${dateTxt}</span>
                <p class="notification-status">${n.Status}</p>
            </div>
		`;

        notifItem.addEventListener('click', async () => {
            if (n.Status === 'Unread') {
                const { error: updateError } = await supabaseClient
                    .from('Notifications')
                    .update({ Status: 'Read' })
                    .eq('NotificationID', n.NotificationID);
                    
                if (!updateError) {
                    // Locally update item appearance
                    n.Status = 'Read'; // Update local status for display logic
                    
                    const statusP = notifItem.querySelector('.notification-status');
                    const dot = notifItem.querySelector('.unread-dot');
                    notifItem.classList.remove('unread');
                    notifItem.classList.add('read');
                    if (dot) dot.remove();
                    statusP.textContent = 'Read';
                    
                    // If filter is Unread, remove the item
                    if (currentFilter === 'Unread') {
                        notifItem.remove();
                        // Reload if the list is now empty to display "No notifications"
                        if (cardContent.querySelectorAll('.notification-item').length === 0) {
                            loadPatientNotificationsPage(1); // Recalculate and display message or next page
                        }
                    }

                    // refresh bell badge
                    loadNotificationsBell();
                } else {
                    console.error('Failed to mark notification as read:', updateError);
                }
            }
        });

        cardContent.appendChild(notifItem);
    });

    // Load More button logic
    const loadMoreId = 'load-more-btn';
    let loadMoreBtn = document.getElementById(loadMoreId);
    
    // Check if there are more items to load (using the total count returned by the query)
    const totalCount = count;
    const itemsLoaded = page * pageSize;

    if (totalCount && totalCount > itemsLoaded) { // Only show if totalCount is available and more items exist
        if (!loadMoreBtn) {
            loadMoreBtn = document.createElement('button');
            loadMoreBtn.id = loadMoreId;
			loadMoreBtn.className = 'w-full py-2 mt-4 text-sm text-white bg-custom-primary rounded hover:bg-custom-hover';
            loadMoreBtn.textContent = 'Load More';
            loadMoreBtn.addEventListener('click', () => {
                currentPage++;
                loadPatientNotificationsPage(currentPage);
            });
            cardContent.appendChild(loadMoreBtn);
        }
        loadMoreBtn.style.display = 'block';
    } else if (loadMoreBtn) {
        loadMoreBtn.remove(); // Remove button if no more items
    }
}

async function markAllAsRead() {
  const userId = localStorage.getItem('userId');
  if (!userId) return;
  const { error } = await supabaseClient
    .from('Notifications')
    .update({ Status: 'Read' })
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread');
  if (error) {
    console.error('Failed to mark all as read:', error);
    return;
  }
  currentPage = 1;
  await loadPatientNotificationsPage(1);
  await loadNotifications();
}

// Header bell: small dropdown preview + badge
async function loadNotifications() {
  if (localStorage.getItem("prefBellNotif") === "false") return;
  const bellBtn = document.getElementById('notifBellBtn');
  if (!bellBtn) return;

  const userId = localStorage.getItem('userId');
  if (!userId) return;

  const { data, error } = await supabaseClient
    .from('Notifications')
    .select('NotificationID, Message, Status, DateSent')
    .eq('UserAccountID', userId)
    .order('DateSent', { ascending: false })
    .limit(5);
  if (error) {
    console.error(error);
    return;
  }

  const unreadCount = (data || []).filter(n => n.Status === 'Unread').length;
  // badge
  let badge = bellBtn.querySelector('[data-badge]');
  if (unreadCount > 0) {
    if (!badge) {
      badge = document.createElement('span');
      badge.setAttribute('data-badge', '1');
      badge.className = 'absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-red-500 text-white text-[11px] leading-[18px] text-center';
      bellBtn.appendChild(badge);
    }
    badge.textContent = String(unreadCount);
    badge.style.display = '';
  } else if (badge) {
    badge.style.display = 'none';
  }

  // dropdown
  let drop = document.getElementById('notifDropdown');
  if (!drop) {
    drop = document.createElement('div');
    drop.id = 'notifDropdown';
    drop.className = 'hidden absolute right-0 mt-2 w-80 bg-white text-gray-800 rounded-lg shadow-lg border border-gray-200 overflow-hidden z-50';
    // anchor to button wrapper
    bellBtn.parentElement.style.position = 'relative';
    bellBtn.parentElement.appendChild(drop);

    document.addEventListener('click', (e) => {
      if (!drop.contains(e.target) && !bellBtn.contains(e.target)) {
        drop.classList.add('hidden');
      }
    });

    bellBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      drop.classList.toggle('hidden');
    });
  }

  const items = (data || []).map(n => {
    const dateTxt = fmtDatePH(n.DateSent);
    const dot = n.Status === 'Unread' ? '<span class="inline-block w-2 h-2 rounded-full bg-custom-primary mr-2"></span>' : '';
    return `
      <a href="notifications.html" class="block px-4 py-3 hover:bg-gray-50 border-b last:border-b-0">
        <div class="text-sm font-medium text-gray-900 truncate">${dot}${n.Message}</div>
        <div class="text-xs text-gray-500 mt-1">${dateTxt}</div>
      </a>`;
  }).join('');

  drop.innerHTML = `
    <div class="px-4 py-3 flex items-center justify-between bg-gray-50">
      <div class="font-semibold text-sm">Notifications</div>
      <a href="notifications.html" class="text-xs text-custom-primary hover:underline">View all</a>
    </div>
    <div>${items || '<div class="px-4 py-6 text-sm text-gray-500">No notifications</div>'}</div>
  `;
}

// Logout (used by sidebar)
async function logout() {
  try { await supabaseClient.auth.signOut(); } catch (e) {}
  localStorage.clear();
  window.location.href = '/Login.html';
}

// Run on page load
window.addEventListener('DOMContentLoaded', async () => {
  await checkAuth();
  setupFilterListeners();
  const markAllBtn = document.getElementById('markAllReadBtn');
  if (markAllBtn) markAllBtn.addEventListener('click', markAllAsRead);
  updateFilterButtons(currentFilter);
  setEmptyStateText();
  await loadPatientNotificationsPage();
  await loadNotifications();
});

</script>
</body>
