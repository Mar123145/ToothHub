<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing & Payments</title>

    <style>

</head>
<body>
    <div class="min-h-screen bg-gray-50">
        <header class="bg-[#03555E] text-white">
            <div class="container mx-auto px-4 py-4 flex items-center gap-4">
                <a href="Dashboard.html">
                    <button class="button-style button-ghost text-white hover:bg-[#024449] flex items-center text-sm">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">

                        </svg>

                    </button>

                    <h1 class="text-xl font-bold">Billing & Payments</h1>
                    <p class="text-sm opacity-90">Manage your payments and invoices</p>
                </div>
            </div>
        </header>

        <div class="container mx-auto px-4 py-8">
            <div class="grid gap-6">

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title">Account Summary</h2>
                    </div>
                    <div class="card-content">
                      <div class="grid md:grid-cols-3 gap-4">
                    <div class="text-center p-4 bg-green-50 rounded-lg">
                        <div id="outstandingAmount" class="text-2xl font-bold text-green-600">₱0.00</div>
                        <div class="text-sm text-gray-600">Outstanding Balance</div>
                    </div>
                    <div class="text-center p-4 bg-blue-50 rounded-lg">
                        <div id="totalPaidAmount" class="text-2xl font-bold text-blue-600">₱0.00</div>
                        <div class="text-sm text-gray-600">Total Paid</div>
                    </div>
                    <div class="text-center p-4 bg-gray-50 rounded-lg">
                        <div id="totalInvoicesCount" class="text-2xl font-bold text-gray-600">0</div>
                        <div class="text-sm text-gray-600">Total Invoices</div>
                    </div>
                    </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                                <path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2h-2zm4 10h8m-8 4h8"></path>
                            </svg>

            </div>

    <!-- Invoice Details Modal -->
<div id="invoice-details-modal" class="fixed inset-0 bg-black/40 hidden items-center justify-center z-50">
  <div class="bg-white rounded-xl shadow-xl w-full max-w-lg p-6 relative">
    <button
      class="absolute top-3 right-3 text-gray-400 hover:text-gray-600"
      onclick="closeInvoiceDetails()"
    >
      ✕
    </button>

    <h2 class="text-lg font-semibold mb-4">Invoice Details</h2>

    <div id="invoiceDetailsContent" class="space-y-4 text-sm">
      <!-- Filled dynamically -->
    </div>

    <div class="mt-5 flex justify-end">
      <button
        class="px-4 py-2 rounded-lg bg-primary text-white text-sm hover:bg-primary-dark"
        onclick="closeInvoiceDetails()"
      >
        Close
      </button>
    </div>
  </div>
</div>

</body>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "https://xpruhdgniomsyeufwhtm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcnVoZGduaW9tc3lldWZ3aHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1ODU1MDgsImV4cCI6MjA3ODE2MTUwOH0.3obk7zsBdWOty0T_ArDUBAcepOecaeO-duVEG6IthcI"; 
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let invoices = [];
    let currentInvoice = null;


    async function checkAuth(redirect = true) {
    // 1️⃣ Try localStorage first
    const storedFirstName = localStorage.getItem('userFirstName');
    const storedRole = localStorage.getItem('userRole');
    const storedEmail = localStorage.getItem('userEmail');

    if (storedFirstName && storedRole) {
        return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail };
    }

    // 2️⃣ Fallback to Supabase session
    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) console.error(sessionError);

    if (!session?.user) {
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    // 3️⃣ Fetch user info from UserAccount table
    const { data: userData, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('Email', session.user.email)
        .maybeSingle();

    if (error || !userData) {
        console.error(error || "No user data found");
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    // 4️⃣ Save to localStorage
    localStorage.setItem('userFirstName', userData.FirstName);
    localStorage.setItem('userRole', userData.Role);
    localStorage.setItem('userEmail', userData.Email);
    localStorage.setItem('userId', session.user.id);

    return userData;
    }

    function formatCurrency(amount) {
  const num = Number(amount) || 0;
  return "₱" + num.toLocaleString("en-PH", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2,
  });
}

async function loadAccountSummary(userId) {
  const outstandingEl = document.getElementById('outstandingAmount');
  const totalPaidEl = document.getElementById('totalPaidAmount');
  const invoicesEl = document.getElementById('totalInvoicesCount');

  // 1) Get all appointments for this patient
  const { data: appointments, error: apptError } = await supabaseClient
    .from('Appointment')
    .select('AppointmentID, UserAccountID, TotalAmount')
    .eq('UserAccountID', userId);

  if (apptError) {
    console.error('Error loading appointments for summary:', apptError);
    if (outstandingEl) outstandingEl.textContent = '₱0.00';
    if (totalPaidEl) totalPaidEl.textContent = '₱0.00';
    if (invoicesEl) invoicesEl.textContent = '0';
    return;
  }

  const appointmentIds = (appointments || []).map(a => a.AppointmentID);
  if (appointmentIds.length === 0) {
    if (outstandingEl) outstandingEl.textContent = '₱0.00';
    if (totalPaidEl) totalPaidEl.textContent = '₱0.00';
    if (invoicesEl) invoicesEl.textContent = '0';
    return;
  }

  // 2) Get all billing rows for those appointments (for this user)
  const { data: bills, error: billError } = await supabaseClient
    .from('Billing')
    .select('AppointmentID, Amount, PaymentStatus')
    .eq('UserAccountID', userId)
    .in('AppointmentID', appointmentIds);

  if (billError) {
    console.error('Error loading billing for summary:', billError);
    if (outstandingEl) outstandingEl.textContent = '₱0.00';
    if (totalPaidEl) totalPaidEl.textContent = '₱0.00';
    if (invoicesEl) invoicesEl.textContent = appointmentIds.length.toString();
    return;
  }

  // 3) Sum PAID per appointment
  const paidByAppointment = {};
  (bills || []).forEach(b => {
    if (b.PaymentStatus !== 'PAID') return;
    const appId = b.AppointmentID;
    if (!paidByAppointment[appId]) paidByAppointment[appId] = 0;
    paidByAppointment[appId] += Number(b.Amount || 0);
  });

  let outstanding = 0;
  let totalPaid = 0;
  let totalInvoices = 0;

  (appointments || []).forEach(appt => {
    const total = Number(appt.TotalAmount || 0);
    const paidForAppt = paidByAppointment[appt.AppointmentID] || 0;
    const remaining = Math.max(total - paidForAppt, 0);

    if (total > 0) {
      totalInvoices += 1;
    }
    totalPaid += paidForAppt;
    outstanding += remaining;
  });

  if (outstandingEl) outstandingEl.textContent = formatCurrency(outstanding);
  if (totalPaidEl) totalPaidEl.textContent = formatCurrency(totalPaid);
  if (invoicesEl) invoicesEl.textContent = totalInvoices.toString();
}

function getTypeChip(type) {
  const label =
    type === 'DOWNPAYMENT'
      ? 'Downpayment'
      : type === 'FINAL_PAYMENT'
      ? 'Full Payment'
      : type || '';

  const isDown = type === 'DOWNPAYMENT';
  const baseClass = "inline-flex items-center px-2 py-0.5 rounded-full text-[11px] font-medium";
  const color = isDown
    ? "bg-blue-50 text-blue-700"
    : "bg-emerald-50 text-emerald-700";

  return `<span class="${baseClass} ${color}">${label}</span>`;
}

function getMethodChip(method) {
  if (!method) return '';
  const m = method.toUpperCase();
  let colorClass = "bg-gray-100 text-gray-800";

  if (m === "GCASH") colorClass = "bg-sky-100 text-sky-800";
  else if (m === "CASH") colorClass = "bg-emerald-100 text-emerald-800";
  else if (m === "CARD") colorClass = "bg-purple-100 text-purple-800";

  return `
    <span class="${colorClass} text-[11px] font-semibold px-2 py-0.5 rounded-full">
      ${m}
    </span>
  `;
}

function getStatusChip(status) {
  if (!status) return '';
  const s = status.toUpperCase();
  let colorClass = "bg-gray-100 text-gray-800";
  let label = status;

  if (s === "PAID") {
    colorClass = "bg-green-100 text-green-800";
    label = "Paid";
  } else if (s === "PENDING") {
    colorClass = "bg-yellow-100 text-yellow-800";
    label = "Pending";
  } else if (s === "REJECTED") {
    colorClass = "bg-red-100 text-red-800";
    label = "Rejected";
  }

  return `
    <span class="${colorClass} text-[11px] font-semibold px-2 py-0.5 rounded-full">
      ${label}
    </span>
  `;
}

async function loadRecentInvoices(userId) {
  const listEl = document.getElementById('invoiceList');
  if (!listEl) return;

  const { data, error } = await supabaseClient
    .from('Billing')
    .select(`
      BillingID,
      AppointmentID,
      Amount,
      PaymentType,
      PaymentMethod,
      PaymentStatus,
      DateIssued,
      Appointment:AppointmentID (
        Service,
        AppointmentSchedule,
        TotalAmount
      )
    `)
    .eq('UserAccountID', userId)
    .order('DateIssued', { ascending: false })
    .limit(10);

  if (error) {
    console.error('Error loading invoices:', error);
    listEl.innerHTML = `<p class="text-sm text-red-500">Failed to load invoices.</p>`;
    return;
  }

  if (!data || data.length === 0) {
    listEl.innerHTML = `
      <div class="text-center py-8 text-gray-500">
        <h3 class="text-base font-medium mb-1">No invoices yet</h3>
        <p class="text-sm">Your billing history will appear here after your appointments.</p>
      </div>
    `;
    return;
  }

  // Store in global array for "View details"
  invoices = data.map(row => ({
    billingId: row.BillingID,
    appointmentId: row.AppointmentID,
    amount: Number(row.Amount || 0),
    paymentType: row.PaymentType,
    paymentMethod: row.PaymentMethod,
    paymentStatus: row.PaymentStatus,
    dateIssued: row.DateIssued,
    appointment: row.Appointment || null
  }));

  const itemsHtml = invoices.map(inv => {
    const appt = inv.appointment || {};
    const dt = inv.dateIssued ? new Date(inv.dateIssued) : null;

    const dateStr = dt
      ? dt.toLocaleDateString('en-PH', {
          month: 'short',
          day: 'numeric',
          year: 'numeric',
        })
      : '';

    const timeStr = dt
      ? dt.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      : '';

    const serviceText = appt.Service
      ? `<div class="text-xs text-gray-400 truncate max-w-xs">${appt.Service}</div>`
      : '';

    return `
      <div class="flex items-center justify-between py-3 border-b last:border-b-0">
        <div class="flex flex-col">
          <span class="text-sm font-semibold text-gray-800">
            ${getTypeChip(inv.paymentType)}
          </span>
          <span class="text-xs text-gray-500 mt-1">
            ${dateStr}${timeStr ? ' · ' + timeStr : ''}
          </span>
          ${serviceText}
        </div>
        <div class="text-right space-y-1">
          <div class="text-sm font-semibold text-gray-900">
            ${formatCurrency(inv.amount)}
          </div>
          <div class="flex items-center justify-end gap-1">
            ${getMethodChip(inv.paymentMethod)}
            ${getStatusChip(inv.paymentStatus)}
          </div>
          <button
            class="mt-1 inline-flex items-center px-2.5 py-1 rounded-lg border text-[11px] text-gray-700 hover:bg-gray-50"
            onclick="openInvoiceDetails(${inv.billingId})"
          >
            View details
          </button>
        </div>
      </div>
    `;
  }).join('');

  listEl.innerHTML = itemsHtml;
}

async function openInvoiceDetails(billingId) {
  const inv = invoices.find(i => i.billingId === billingId);
  if (!inv) return;

  currentInvoice = inv;

  const apptId = inv.appointmentId;
  const contentEl = document.getElementById('invoiceDetailsContent');

  try {
    // 1) Get full appointment info (for totals)
    const { data: appt, error: apptErr } = await supabaseClient
      .from('Appointment')
      .select(`
        AppointmentID,
        AppointmentSchedule,
        Service,
        TotalAmount
      `)
      .eq('AppointmentID', apptId)
      .single();

    if (apptErr) {
      console.error('Error loading appointment details:', apptErr);
    }

    // 2) Get all billing rows for this appointment
    const { data: billRows, error: billErr } = await supabaseClient
      .from('Billing')
      .select('BillingID, Amount, PaymentType, PaymentMethod, PaymentStatus, DateIssued')
      .eq('AppointmentID', apptId)
      .order('DateIssued', { ascending: true });

    if (billErr) {
      console.error('Error loading billing rows for details:', billErr);
    }

    const totalAmount = appt ? Number(appt.TotalAmount || 0) : 0;
    const totalPaid = (billRows || [])
      .filter(b => b.PaymentStatus === 'PAID')
      .reduce((sum, b) => sum + Number(b.Amount || 0), 0);
    const remaining = Math.max(totalAmount - totalPaid, 0);

    const apptDate = appt?.AppointmentSchedule ? new Date(appt.AppointmentSchedule) : null;
    const apptDateStr = apptDate
      ? apptDate.toLocaleString('en-PH', { dateStyle: 'medium', timeStyle: 'short' })
      : '—';

    const serviceText = appt?.Service || '—';

    const paymentsHtml = (billRows || []).map(b => {
      const dt = b.DateIssued ? new Date(b.DateIssued) : null;
      const dStr = dt
        ? dt.toLocaleString('en-PH', {
            month: 'short',
            day: 'numeric',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          })
        : '';

      return `
        <div class="flex items-center justify-between py-2 border-b last:border-b-0">
          <div class="flex flex-col">
            <span class="text-xs text-gray-500">${dStr}</span>
            <div class="mt-1 flex gap-1">
              ${getTypeChip(b.PaymentType)}
              ${getMethodChip(b.PaymentMethod)}
              ${getStatusChip(b.PaymentStatus)}
            </div>
          </div>
          <div class="text-sm font-semibold text-gray-900">
            ${formatCurrency(b.Amount)}
          </div>
        </div>
      `;
    }).join('');

    contentEl.innerHTML = `
      <div class="space-y-1">
        <p><span class="font-medium">Appointment date:</span> ${apptDateStr}</p>
        <p><span class="font-medium">Services:</span> ${serviceText}</p>
      </div>

      <div class="grid grid-cols-3 gap-3 text-sm">
        <div class="p-3 rounded-lg bg-gray-50">
          <div class="text-[11px] text-gray-500">Total Amount</div>
          <div class="font-semibold text-gray-900">${formatCurrency(totalAmount)}</div>
        </div>
        <div class="p-3 rounded-lg bg-green-50">
          <div class="text-[11px] text-green-700">Total Paid</div>
          <div class="font-semibold text-green-800">${formatCurrency(totalPaid)}</div>
        </div>
        <div class="p-3 rounded-lg bg-amber-50">
          <div class="text-[11px] text-amber-700">Remaining</div>
          <div class="font-semibold text-amber-800">${formatCurrency(remaining)}</div>
        </div>
      </div>

      <div class="pt-3">
        <h3 class="text-sm font-semibold mb-2">Payment History</h3>
        <div class="border rounded-lg divide-y">
          ${paymentsHtml || '<div class="p-3 text-xs text-gray-500">No payments yet.</div>'}
        </div>
      </div>
    `;

    const modal = document.getElementById('invoice-details-modal');
    modal.classList.remove('hidden');
    modal.classList.add('flex');
  } catch (err) {
    console.error(err);
  }
}

function closeInvoiceDetails() {
  const modal = document.getElementById('invoice-details-modal');
  modal.classList.add('hidden');
  modal.classList.remove('flex');
  currentInvoice = null;
}

  // }

  const userId = localStorage.getItem('userId');
  if (!userId) {
    console.error('No userId in localStorage');
    return;
  }

   await loadAccountSummary(userId);
  await loadRecentInvoices(userId);w
});


</script>
