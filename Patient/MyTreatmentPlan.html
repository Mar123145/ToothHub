    // --- Auth (same approach as Dashboard) ---
    async function checkAuth(redirect = true) {
      const storedFirstName = localStorage.getItem("userFirstName");
      const storedRole = localStorage.getItem("userRole");
      const storedEmail = localStorage.getItem("userEmail");
      if (storedFirstName && storedRole) return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail };

      const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
      if (sessionError) console.error(sessionError);

      if (!session?.user) {
        if (redirect) window.location.href = "/Login.html";
        return null;
      }

      const { data: userData, error } = await supabaseClient
        .from("UserAccount")
        .select("*")
        .eq("Email", session.user.email)
        .maybeSingle();

      if (error || !userData) {
        console.error(error || "No user data found");
        if (redirect) window.location.href = "/Login.html";
        return null;
      }

      localStorage.setItem("userFirstName", userData.FirstName);
      localStorage.setItem("userRole", userData.Role);
      localStorage.setItem("userEmail", userData.Email);
      localStorage.setItem("userId", session.user.id);

      return userData;
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      localStorage.clear();

    }

    // --- Helpers ---
        function fmtDate(iso) {
        if (!iso) return "—";
        try {
            return new Date(iso).toLocaleDateString("en-PH", {
            timeZone: "Asia/Manila",
            year: "numeric",
            month: "long",
            day: "numeric",
            });
        } catch {
            return iso;
        }
        }
    function badge(status) {
      const s = String(status || "").toUpperCase();
      const map = {
        "ACTIVE": "bg-emerald-50 text-emerald-700 border-emerald-200",
        "PROPOSED": "bg-amber-50 text-amber-700 border-amber-200",
        "PAUSED": "bg-gray-100 text-gray-700 border-gray-200",
        "COMPLETED": "bg-blue-50 text-blue-700 border-blue-200",
      };
      return map[s] || "bg-gray-100 text-gray-700 border-gray-200";
    }


    function badgeAppointment(status) {
    const s = String(status || "").toUpperCase();

    if (s === "FINISHED") return "bg-emerald-50 text-emerald-700 border-emerald-200";
    if (s === "APPROVED") return "bg-blue-50 text-blue-700 border-blue-200";
    if (s === "PENDING") return "bg-amber-50 text-amber-700 border-amber-200";
    if (s === "RESCHEDULED") return "bg-purple-50 text-purple-700 border-purple-200";
    if (s === "CANCELLED") return "bg-red-50 text-red-700 border-red-200";
    if (s === "REJECTED") return "bg-red-50 text-red-700 border-red-200";

    return "bg-gray-100 text-gray-700 border-gray-200";
    }

    function toggleAdjustmentsHistory() {
    const panel = document.getElementById("adj-history-panel");
    const icon = document.getElementById("adj-history-icon");

    if (!panel) return;

    panel.classList.toggle("hidden");

    if (btn) btn.textContent = nowHidden ? "View" : "Hide";

    }

    function isInstallServiceName(name) {
      const n = String(name || "").toLowerCase();
      return n.includes("installation") || n.includes("bonding") || n.includes("braces bonding") || n.includes("appliance placement");
    }

    function isAdjustmentServiceName(name) {
      const n = String(name || "").toLowerCase();
      return n.includes("adjustment") || n.includes("ortho adjustment") || n.includes("orthodontic adjustment");
    }

    function isInstall(appt) {
  return Number(appt?.ServiceType) === 701;
}
function isAdjust(appt) {
  return Number(appt?.ServiceType) === 702;
}

    // --- Data fetch ---
    async function loadLatestBracesPlan(userId) {
      const { data, error } = await supabaseClient
        .from("TreatmentPlan")
        .select("*")
        .eq("UserAccountID", userId)
        .eq("PlanType", "BRACES")
        .order("CreatedAt", { ascending: false })
        .limit(1);

      if (error) throw error;
      return (data && data[0]) ? data[0] : null;
    }

 async function loadPlanAppointments(treatmentPlanId, userId, sourceAppointmentId) {
  let q = supabaseClient
    .from("Appointment")
    .select(`
      AppointmentID,
      Service,
      ServiceType,
      Status,
      AppointmentSchedule,
      TreatmentPlanID,
      Dentist:DentistID ( FirstName, LastName )
    `);

  if (treatmentPlanId) q = q.eq("TreatmentPlanID", treatmentPlanId);
  else q = q.eq("UserAccountID", userId);

  const { data: planLinked, error } = await q;
  if (error) throw error;

  // also include the source diagnostic appointment even if TreatmentPlanID is null
  let src = null;
  if (sourceAppointmentId) {
    const { data: srcRow, error: srcErr } = await supabaseClient
      .from("Appointment")
      .select(`
        AppointmentID,
        Service,
        ServiceType,
        Status,
        AppointmentSchedule,
        TreatmentPlanID,
        Dentist:DentistID ( FirstName, LastName )
      `)
      .eq("AppointmentID", sourceAppointmentId)
      .maybeSingle();

    if (srcErr) throw srcErr;
    src = srcRow || null;
  }

  const merged = [...(planLinked || [])];
  if (src && !merged.some(a => a.AppointmentID === src.AppointmentID)) merged.push(src);

  return merged;
}

async function loadPretreatments(planId) {
  if (!planId) return [];

  const { data, error } = await supabaseClient
    .from("treatmentplanpretreatment")
    .select("pretreatmentid, serviceid, servicename, status, createdat, completedat")
    .eq("treatmentplanid", planId)
    .order("createdat", { ascending: true });

  if (error) throw error;
  return data || [];
}


function computeProgressFromAppointments(appts) {
  let installScheduledDate = null;
  let installDoneDate = null;
  let installScheduled = false;
  let installDone = false;

  let consultScheduledDate = null;
  let consultDoneDate = null;
  let consultScheduled = false;
  let consultDone = false;

  let adjustmentsCount = 0;
  let lastAdjustmentDate = null;

  for (const a of (appts || [])) {
    const serviceName = a.Service || a.ServiceType || "";
    const status = String(a.Status || "").toUpperCase();
    const sched = a.AppointmentSchedule ? new Date(a.AppointmentSchedule) : null;

    // ✅ CONSULTATION (Orthodontic Diagnostic)
    const sLower = String(serviceName).toLowerCase();
    if (sLower.includes("diagnostic") || sLower.includes("consult")) {
      if (status === "FINISHED") {
        consultDone = true;
        if (!consultDoneDate || (sched && sched > consultDoneDate)) consultDoneDate = sched;
      } else if (["APPROVED", "PENDING", "RESCHEDULED"].includes(status)) {
        consultScheduled = true;
        if (!consultScheduledDate || (sched && sched > consultScheduledDate)) consultScheduledDate = sched;
      }
    }

    // ✅ INSTALLATION
    if (isInstall(a)) {
      if (status === "FINISHED") {
        installDone = true;
        if (!installDoneDate || (sched && sched > installDoneDate)) installDoneDate = sched;
      } else if (["APPROVED", "PENDING", "RESCHEDULED"].includes(status)) {
        installScheduled = true;
        if (!installScheduledDate || (sched && sched > installScheduledDate)) installScheduledDate = sched;
      }
    }

        if (isAdjust(a) && status === "FINISHED") {
          adjustmentsCount += 1;

          if (!lastAdjustmentDate || (sched && sched > lastAdjustmentDate)) {
            lastAdjustmentDate = sched;
          }
        }
      }

  return {
    consultScheduled,
    consultScheduledDate: consultScheduledDate ? consultScheduledDate.toISOString() : null,
    consultDone,
    consultDoneDate: consultDoneDate ? consultDoneDate.toISOString() : null,

    installScheduled,
    installScheduledDate: installScheduledDate ? installScheduledDate.toISOString() : null,
    installDone,
    installDoneDate: installDoneDate ? installDoneDate.toISOString() : null,

    adjustmentsCount,
    lastAdjustmentDate: lastAdjustmentDate ? lastAdjustmentDate.toISOString() : null,
  };
}


function esc(s) {
  return (s == null ? "" : String(s))
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function summarizeTeeth(teethStatus) {
  if (!teethStatus || typeof teethStatus !== "object") return "";
  const groups = {};
  for (const [tooth, status] of Object.entries(teethStatus)) {
    if (!status || status === "Clear") continue;
    if (!groups[status]) groups[status] = [];
    groups[status].push(Number(tooth));
  }
  const rows = Object.entries(groups)
    .map(([status, teeth]) => {
      teeth.sort((a, b) => a - b);
      return `
        <div class="p-3 rounded-lg border bg-gray-50">
          <div class="text-xs font-semibold text-gray-700">${esc(status)}</div>
          <div class="text-sm text-gray-700 mt-1">${teeth.join(", ")}</div>
        </div>
      `;
    })
    .join("");
  return rows || `<p class="text-sm text-gray-500">No tooth marks recorded.</p>`;
}

const TOOTH_STATUS_META = {

  "Composite": { border: "border-sky-600", overlay: "" },
  "Complete Denture": { border: "border-violet-600", overlay: "" },
  "Crowns": { border: "border-indigo-600", overlay: "" },
  "Clear": { border: "border-gray-300", overlay: "" },
};

const TOOTH_STATUS_OPTIONS = Object.keys(TOOTH_STATUS_META);

function toothBtnHTML(n, status) {
  const meta = TOOTH_STATUS_META[status || "Clear"] || TOOTH_STATUS_META.Clear;

      class="w-full aspect-square relative flex items-center justify-center tooth-shape bg-white transition-all duration-200 shadow-sm border-4 ${meta.border} ${isMarked ? "shadow-md" : ""}">
      <div class="tooth-button-inner">
        <span class="text-xl font-bold text-gray-900">${n}</span>
        ${meta.overlay ? `<div class="absolute inset-0 flex items-center justify-center text-3xl font-extrabold text-gray-700/70">${meta.overlay}</div>` : ""}
      </div>
    </button>
  `;
}

function renderToothChartHTML(teethStatus) {
  const Q1 = [8,7,6,5,4,3,2,1];
  const Q2 = [9,10,11,12,13,14,15,16];
  const Q4 = [32,31,30,29,28,27,26,25];
  const Q3 = [24,23,22,21,20,19,18,17];

  const quad = (nums, upper) => `
    <div class="quadrant-grid ${upper ? "upper-arch" : "lower-arch"}">
      ${nums.map(n => toothBtnHTML(n, teethStatus?.[n])).join("")}
    </div>
  `;

  const legend = `
    <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2 mb-4">
      ${TOOTH_STATUS_OPTIONS.filter(s => s !== "Clear").map(s => {
        const m = TOOTH_STATUS_META[s];
        return `
          <div class="flex items-center gap-2 px-3 py-2 rounded-lg border bg-gray-50">
            <span class="w-4 h-4 border-4 rounded ${m.border} bg-white"></span>
            <span class="text-xs font-semibold">${esc(s)}</span>
          </div>
        `;
      }).join("")}
      <div class="flex items-center gap-2 px-3 py-2 rounded-lg border bg-white">
        <span class="w-3 h-3 rounded-full bg-white border border-gray-300"></span>
        <span class="text-xs font-semibold">Clear</span>
      </div>
    </div>
  `;

  return `
    <div class="border p-4 rounded-xl bg-gray-50">
      <div class="flex items-center justify-between mb-4">
        <div>
          <div class="text-sm font-bold text-gray-700">Tooth Chart</div>
          <div class="text-xs text-gray-500">View only</div>
        </div>
      </div>

      ${legend}

      <div class="bg-white p-4 rounded-xl border shadow-inner">
        <h4 class="text-center text-xs font-semibold text-gray-500 mb-2 uppercase tracking-widest">
          Maxillary Arch (Upper)
        </h4>
        <div class="tooth-chart-container">
          ${quad(Q1, true)}
          <div class="text-sm font-light text-gray-300">|</div>
          ${quad(Q2, true)}
        </div>

        <div class="w-full h-1 bg-gray-100 my-4 rounded-full"></div>

        <div class="tooth-chart-container">
          ${quad(Q4, false)}
          <div class="text-sm font-light text-gray-300">|</div>
          ${quad(Q3, false)}
        </div>

        <h4 class="text-center text-xs font-semibold text-gray-500 mt-2 uppercase tracking-widest">
          Mandibular Arch (Lower)
        </h4>
      </div>
    </div>
  `;
}

async function loadNotifications() {
    // Small delay for rendering
    await new Promise(r => setTimeout(r, 100));

    // Get bell container
    const bellContainer = document.getElementById('notifBellBtn');
    if (!bellContainer) return console.warn("Bell icon container not found");

    const bellIcon = bellContainer.querySelector('svg, i'); // after lucide, it becomes SVG
    // Attach click to the container so clicks on padding also work
    if (!bellIcon) console.warn("Bell icon not found (icon may render later)");

    const userId = localStorage.getItem('userId');
    if (!userId) return;

    // Fetch unread notifications
    const { data: notifications, error } = await supabaseClient
    .from('Notifications')
    .select(`
        NotificationID,
        Message,
        Status,
        DateSent,
        AppointmentID,
        Appointment:AppointmentID (
        AppointmentID,
        UserAccountID,
        User:UserAccountID (FirstName, LastName)
        )
    `)
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread')
    .order('DateSent', { ascending: false });

    if (error) return console.error(error);

    // Remove previous badge if exists
    const existingBadge = document.getElementById('notif-badge');
    if (existingBadge) existingBadge.remove();

    if (notifications.length > 0) {
        const badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = notifications.length;
        badge.className = 'absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full';
        bellContainer.appendChild(badge);
    }

    // Remove previous dropdown if exists
    const prevDropdown = document.getElementById('notif-dropdown');
    if (prevDropdown) prevDropdown.remove();

    bellContainer.onclick = async () => {
        let dropdown = document.getElementById('notif-dropdown');
        if (dropdown) return dropdown.remove();

        dropdown = document.createElement('div');
        dropdown.id = 'notif-dropdown';
        dropdown.className = 'absolute right-0 top-[48px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50';
        dropdown.style.maxHeight = '320px';

        if (!notifications || notifications.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'p-4 text-gray-500 text-sm';
            emptyMsg.textContent = 'No new notifications';
            dropdown.appendChild(emptyMsg);
        } else {
          notifications.forEach(n => {
            const item = document.createElement('button');
            item.type = "button";
            item.className =
              'w-full text-left px-4 py-3 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer text-sm text-gray-700';

            const first = n.Appointment?.User?.FirstName ?? '';
            const last  = n.Appointment?.User?.LastName ?? '';
            const patientName = `${first} ${last}`.trim() || 'Unknown Patient';

            const originalMsg = n.Message || `You have a new approved appointment for patient ${patientName}`;
            item.textContent = originalMsg.replace(/patient\s*ID\s*[a-f0-9-]{8,}/i, `patient ${patientName}`);

            item.addEventListener("click", async (e) => {
              e.stopPropagation();

              const { error: updErr } = await supabaseClient
                .from("Notifications")
                .update({ Status: "Read" })
                .eq("NotificationID", n.NotificationID);

              if (updErr) {
                console.error("Failed to mark notification as read:", updErr);
                return;
              }

              // Remove dropdown and refresh badge/list
              const dd = document.getElementById("notif-dropdown");
              if (dd) dd.remove();

              loadNotifications();
            });

            dropdown.appendChild(item);
          });

        }

        bellContainer.style.position = 'relative';
        bellContainer.appendChild(dropdown);
    };
}

    
    async function init() {
      const user = await checkAuth();
      if (!user) return;

      const userId = localStorage.getItem("userId");
      const container = document.getElementById("tpContainer");

      container.innerHTML = `
        <section class="bg-white border rounded-2xl shadow-sm p-6">
          <div class="flex items-center gap-3 text-gray-600">
            <i class="fa-solid fa-spinner fa-spin"></i>
            <p>Loading treatment plan...</p>
          </div>
        </section>
      `;

      try {
        const plan = await loadLatestBracesPlan(userId);
        if (!plan) return renderNoPlan();
        const appts = await loadPlanAppointments(plan.TreatmentPlanID, userId, plan.SourceAppointmentID);
        window.appts = appts;

        const pretreat = await loadPretreatments(plan.TreatmentPlanID);

        const progress = computeProgressFromAppointments(appts);
        renderPlan(plan, progress, appts, pretreat);

      } catch (e) {
        console.error(e);
        container.innerHTML = `
            <section class="bg-white border rounded-2xl shadow-sm p-6">
            <div class="p-4 rounded-xl border bg-red-50 text-red-700">
                <p class="font-semibold">Failed to load treatment plan</p>
                <p class="text-sm mt-1">Please refresh the page or try again later.</p>
            </div>
            </section>
        `;
        }
      loadNotifications();
      const bellBtn = document.getElementById("notifBellBtn");
if (bellBtn) bellBtn.onclick = openNotifications;
    }

    window.addEventListener("DOMContentLoaded", init);

  </script>
