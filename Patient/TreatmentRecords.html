// ---- Non-React helpers (moved out of Babel) ----
function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

function formatMedicalConditions(cond) {
  if (!cond) return "—";
  if (typeof cond === "string") return cond || "—"; // fallback if stored as text

  if (typeof cond === "object") {
    const selected = Object.entries(cond)
      .filter(([k, v]) => k !== "other" && v === true)
      .map(([k]) =>
        k.replace(/([A-Z])/g, " $1").replace(/^./, (c) => c.toUpperCase())
      );

    // In your current JSON, other is boolean. If later you change it to string, this still supports it.
    const otherText =
      typeof cond.other === "string" && cond.other.trim()
        ? `Other: ${cond.other.trim()}`
        : "";

    const out = [...selected, otherText].filter(Boolean).join(", ");
    return out || "—";
  }

  return String(cond);
}


const _signedUrlCache = new Map(); // key -> { url, expAt }

async function getSignedUrlCached(bucket, path, expiresInSeconds = 3600) {
  if (!path) return null;

  const key = `${bucket}:${path}`;
  const now = Date.now();

  const cached = _signedUrlCache.get(key);
  if (cached && cached.expAt > now + 10_000) { // still valid (10s buffer)
    return cached.url;
  }

  const { data, error } = await supabaseClient.storage
    .from(bucket)
    .createSignedUrl(path, expiresInSeconds);

  if (error) {
    console.error(error);
    return null;
  }

  const url = data?.signedUrl || null;
  if (url) _signedUrlCache.set(key, { url, expAt: now + expiresInSeconds * 1000 });
  return url;
}

function createSignaturePad(canvas, opts = {}) {
  const ctx = canvas.getContext("2d", { willReadFrequently: true });

  const state = {
    drawing: false,
    lastX: 0,
    lastY: 0,
    hasInk: false,
  };

  const settings = {
    lineWidth: opts.lineWidth ?? 2.2,
    lineColor: opts.lineColor ?? "#111",
    background: opts.background ?? "#fff",
  };

  function resizeCanvasToDisplaySize() {
    const rect = canvas.getBoundingClientRect();
    const dpr = window.devicePixelRatio || 1;

    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.strokeStyle = settings.lineColor;
    ctx.lineWidth = settings.lineWidth;
  }

  function getPointFromEvent(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.clientX ?? e.touches?.[0]?.clientX;
    const clientY = e.clientY ?? e.touches?.[0]?.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(e) {
    e.preventDefault();
    state.drawing = true;
    const p = getPointFromEvent(e);
    state.lastX = p.x;
    state.lastY = p.y;
    ctx.beginPath();
    ctx.moveTo(state.lastX, state.lastY);
  }

  function draw(e) {
    if (!state.drawing) return;
    e.preventDefault();
    const p = getPointFromEvent(e);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();
    state.lastX = p.x;
    state.lastY = p.y;
    state.hasInk = true;
  }

  function endDraw(e) {
    if (!state.drawing) return;
    e.preventDefault();
    state.drawing = false;
    ctx.closePath();
  }

  function clear() {
    const rect = canvas.getBoundingClientRect();
    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);
    state.hasInk = false;
  }

  async function loadFromUrl(url) {
    if (!url) return;
    const rect = canvas.getBoundingClientRect();

    ctx.clearRect(0, 0, rect.width, rect.height);
    ctx.fillStyle = settings.background;
    ctx.fillRect(0, 0, rect.width, rect.height);

    await new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(rect.width / img.width, rect.height / img.height);
        const w = img.width * scale;
        const h = img.height * scale;
        ctx.drawImage(img, (rect.width - w) / 2, (rect.height - h) / 2, w, h);
        state.hasInk = true;
        resolve();
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  canvas.addEventListener("pointerdown", startDraw);
  canvas.addEventListener("pointermove", draw);
  window.addEventListener("pointerup", endDraw);
  window.addEventListener("pointercancel", endDraw);

  resizeCanvasToDisplaySize();

  const ro = new ResizeObserver(() => {
    resizeCanvasToDisplaySize();
    state.hasInk = false;
  });
  ro.observe(canvas);

  return {
    clear,
    loadFromUrl,
    hasInk: () => state.hasInk,
    destroy: () => ro.disconnect(),
  };
}

function lockConsentUI(lock) {
  document.getElementById("consentTemplateSelect").disabled = true;
  document.getElementById("consentPatientName").disabled = true;

  if (btn) btn.style.display = "none";

  // stop drawing / editing signatures
  const pc = document.getElementById("patientSigCanvas");
  const sc = document.getElementById("staffSigCanvas");
  if (pc) pc.style.pointerEvents = "none";
  if (sc) sc.style.pointerEvents = "none";

  const pClear = document.getElementById("patientSigClear");
  const sClear = document.getElementById("staffSigClear");
  if (pClear) pClear.style.display = "none";
  if (sClear) sClear.style.display = "none";
}
function initConsentSignaturePads() {
  const patientCanvas = document.getElementById("patientSigCanvas");
  const staffCanvas = document.getElementById("staffSigCanvas");

  if (patientCanvas && !window.patientPad) {
    window.patientPad = createSignaturePad(patientCanvas, { lineWidth: 2.2 });
  }
  if (staffCanvas && !window.staffPad) {
    window.staffPad = createSignaturePad(staffCanvas, { lineWidth: 2.2 });
  }

}

async function loadConsentById(consentId) {
  const { data, error } = await supabaseClient
    .from("AppointmentConsent")
    .select("*")
    .eq("ConsentID", consentId)
    .maybeSingle();

  if (error || !data) {
    console.error(error);
    return showMessage("Failed to open consent.", "error");
  }

  console.log("CONSENT DATA:", data);
  // 1) Close list and show modal immediately (feels instant)
  closeConsentsList();
  showConsentModal();
  lockConsentUI(true); // dentist view-only

  // 2) Fill fields (fast)
  document.getElementById("consentPatientName").value = data.PatientName || "";
  document.getElementById("consentStaffName").value = data.StaffName || "";
  document.getElementById("consentDate").value = data.ConsentDate || "";
  document.getElementById("consentText").value = data.ConsentText || "";
  const statusEl = document.getElementById("consentStatus");
  if (statusEl) statusEl.textContent = data.Status || "—";

  // 3) Show a readable "title" even though template select is disabled
  const title =
    data.ConsentTitle ||
    data.TemplateTitle ||
    data.ServiceSnapshot ||
    "Consent";

  const sel = document.getElementById("consentTemplateSelect");
  if (sel) {
    sel.innerHTML = `<option>${title}</option>`;
    sel.value = title;
  }

  // 4) IMPORTANT: init pads ONLY after modal is visible, so canvases have real size
  requestAnimationFrame(async () => {
    // build pads now that the modal is visible
    initConsentSignaturePads();

    // clear + load signatures
    window.patientPad?.clear();
    window.staffPad?.clear();

    // Use cached signed URLs for speed
    const patientUrl = await getSignedUrlCached("consent-signatures", data.PatientSignaturePath);
    if (patientUrl) await window.patientPad?.loadFromUrl(patientUrl);

    const staffUrl = await getSignedUrlCached("consent-signatures", data.StaffSignaturePath);
    if (staffUrl) await window.staffPad?.loadFromUrl(staffUrl);
  });
}
async function openConsentsListForAppointment(appointmentId) {
  if (!appointmentId) return;

  // show modal immediately (fast)
  showConsentsList();

  const container = document.getElementById("consentsListContainer");
  if (container) container.innerHTML = `<div class="text-sm text-gray-500">Loading consents...</div>`;

  const { data, error } = await supabaseClient
    .from("AppointmentConsent")
    .select("ConsentID, ConsentTitle, Status, ConsentDate, CreatedAt")
    .eq("AppointmentID", appointmentId)
    .order("CreatedAt", { ascending: false });

  if (error) {
    console.error(error);
    if (container) container.innerHTML = `<div class="text-sm text-red-600">Failed to load consents.</div>`;
    showMessage("Failed to load consents.", "error");
    return;
  }

  const rows = data || [];
  if (!container) return;

  if (rows.length === 0) {
    container.innerHTML = `<div class="text-sm text-gray-500">No consents found for this appointment.</div>`;
    return;
  }

  container.innerHTML = rows.map(c => {
    const title = c.ConsentTitle || "Consent";
    const date = c.ConsentDate || (c.CreatedAt ? new Date(c.CreatedAt).toLocaleDateString("en-PH") : "—");
    const status = c.Status || "—";

 return `
  <div class="border rounded-lg p-4 hover:bg-gray-50 transition">
    <div class="flex items-center justify-between gap-4">
      <div>
        <div class="font-semibold text-gray-900">
          ${escapeHtml(title)}
        </div>
        <div class="text-xs text-gray-500 mt-1">
          ${escapeHtml(date)}
        </div>
      </div>

      <div class="flex items-center gap-3">
        <div class="text-xs font-semibold px-2 py-1 rounded-full border bg-white">
          ${escapeHtml(status)}
        </div>

        <button
          class="px-3 py-1.5 text-sm rounded-md border border-gray-300
                 hover:bg-gray-100 transition font-medium"
          onclick="loadConsentById('${c.ConsentID}')"
        >
          Open
        </button>
      </div>
    </div>
  </div>
`;
  }).join("");
}

// expose to button click in React JSX
window.openConsentsListForAppointment = openConsentsListForAppointment;

// tiny helper (prevents breaking HTML when titles contain special chars)
function escapeHtml(s) {
  const str = s == null ? "" : String(s);
  return str
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function getTodayRangePH() {
  const parts = new Intl.DateTimeFormat("en-CA", {
    timeZone: "Asia/Manila",
    year: "numeric",
    month: "2-digit",
    day: "2-digit",
  }).formatToParts(new Date());

  const y = parts.find(p => p.type === "year")?.value;
  const m = parts.find(p => p.type === "month")?.value;
  const d = parts.find(p => p.type === "day")?.value;

  // Return Date objects (so comparisons work)
  const start = new Date(`${y}-${m}-${d}T00:00:00+08:00`);
  const end   = new Date(`${y}-${m}-${d}T23:59:59.999+08:00`);
  return { start, end };
}

// --- Tooth Button (IMPROVED VISUAL DESIGN) ---
function ToothButton({ number, status, onClick, isUpperArch, isEditing }) {
  const meta = status ? TOOTH_STATUS_META[status] : null;

  const baseBorder = meta?.border || "border-gray-300";
  const isMarked = meta && status !== "Clear";

  return (
    <button
      type="button"
      title={status || "Clear"}
      onClick={(e) => {
        e.stopPropagation();
        if (!isEditing) return; // patient view-only
        onClick();
      }}
      className={[
        "w-full aspect-square relative flex items-center justify-center tooth-shape",
        "bg-white transition-all duration-200 shadow-sm",
        "border-4",
        baseBorder,
        isMarked ? "shadow-md" : "hover:bg-gray-50"
      ].join(" ")}
    >
      <div className="tooth-button-inner">
        <span className="text-xl font-bold text-gray-900">{number}</span>

        {/* Missing overlay */}
        {meta?.overlay === "X" && (
          <div className="absolute inset-0 flex items-center justify-center text-3xl font-extrabold text-gray-700/70">
            ×
          </div>
        )}
      </div>
    </button>
  );
}

function ToothChartGrid({ teethStatus, handleToothClick, isEditing }) {
  const Q1 = [8, 7, 6, 5, 4, 3, 2, 1];
  const Q2 = [9, 10, 11, 12, 13, 14, 15, 16];
  const Q4 = [32, 31, 30, 29, 28, 27, 26, 25];
  const Q3 = [24, 23, 22, 21, 20, 19, 18, 17];

  const renderQuadrant = (numbers, isUpperArch) => (
    <div className={`quadrant-grid ${isUpperArch ? "upper-arch" : "lower-arch"}`}>
      {numbers.map((n) => (
        <ToothButton
          key={n}
          number={n}
          status={teethStatus[n]}
          onClick={() => handleToothClick(n)}
          isUpperArch={isUpperArch}
          isEditing={isEditing}
        />
      ))}
    </div>
  );

  return (
    <div className="bg-white p-4 rounded-xl border shadow-inner">
      <h4 className="text-center text-xs font-semibold text-gray-500 mb-2 uppercase tracking-widest">
        Maxillary Arch (Upper)
      </h4>

      <div className="tooth-chart-container">
        {renderQuadrant(Q1, true)}
        <div className="text-sm font-light text-gray-300">|</div>
        {renderQuadrant(Q2, true)}
      </div>

      <div className="w-full h-1 bg-gray-100 my-4 rounded-full"></div>

      <div className="tooth-chart-container">
        {renderQuadrant(Q4, false)}
        <div className="text-sm font-light text-gray-300">|</div>
        {renderQuadrant(Q3, false)}
      </div>

      <h4 className="text-center text-xs font-semibold text-gray-500 mt-2 uppercase tracking-widest">
        Mandibular Arch (Lower)
      </h4>
    </div>
  );
}

                            <div className="flex justify-end gap-4 pt-4">

)}

                </div>

      }

<script>
  const SUPABASE_URL_SHELL = "https://xpruhdgniomsyeufwhtm.supabase.co";
  const SUPABASE_ANON_KEY_SHELL = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcnVoZGduaW9tc3lldWZ3aHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1ODU1MDgsImV4cCI6MjA3ODE2MTUwOH0.3obk7zsBdWOty0T_ArDUBAcepOecaeO-duVEG6IthcI";
  const supabaseShell = window.supabase.createClient(SUPABASE_URL_SHELL, SUPABASE_ANON_KEY_SHELL);

  async function logout() {
    try { await supabaseShell.auth.signOut(); } catch(e) {}
    localStorage.clear();
    window.location.href = "/Login.html";
  }

  async function loadNotifications() {
    if (localStorage.getItem("prefBellNotif") === "false") return;
    const bellBtn = document.getElementById("notifBellBtn");
    if (!bellBtn) return;

    const userId = localStorage.getItem("userId");
    if (!userId) return;

    const { data: notifications, error } = await supabaseShell
      .from("Notifications")
      .select("*")
      .eq("UserAccountID", userId)
      .eq("Status", "Unread")
      .order("DateSent", { ascending: false });

    if (error) { console.error(error); return; }

    const existingBadge = document.getElementById("notif-badge");
    if (existingBadge) existingBadge.remove();

    if (notifications && notifications.length > 0) {
      const badge = document.createElement("span");
      badge.id = "notif-badge";
      badge.textContent = notifications.length;
      badge.className = "absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full";
      bellBtn.appendChild(badge);
    }

    const prevDropdown = document.getElementById("notif-dropdown");
    if (prevDropdown) prevDropdown.remove();

    bellBtn.onclick = async () => {
      let dropdown = document.getElementById("notif-dropdown");
      if (dropdown) return dropdown.remove();

      dropdown = document.createElement("div");
      dropdown.id = "notif-dropdown";
      dropdown.className = "absolute right-4 top-[72px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50";
      dropdown.style.maxHeight = "320px";

      if (!notifications || notifications.length === 0) {
        const emptyMsg = document.createElement("div");
        emptyMsg.className = "p-4 text-gray-500 text-sm";
        emptyMsg.textContent = "No new notifications";
        dropdown.appendChild(emptyMsg);
      } else {
        notifications.forEach((n) => {
          const item = document.createElement("button");
          item.type = "button";
          item.className = "w-full text-left p-4 border-b last:border-b-0 hover:bg-gray-50 text-gray-900";
          item.textContent = n.Message;
          item.addEventListener("click", async () => {
            await supabaseShell.from("Notifications").update({ Status: "Read" }).eq("NotificationID", n.NotificationID);
            dropdown.remove();
            loadNotifications();
          });
          dropdown.appendChild(item);
        });
      }

      document.body.appendChild(dropdown);

      const onDocClick = (e) => {
        if (!dropdown.contains(e.target) && e.target !== bellBtn && !bellBtn.contains(e.target)) {
          dropdown.remove();
          document.removeEventListener("click", onDocClick);
        }
      };
      setTimeout(() => document.addEventListener("click", onDocClick), 0);
    };
  }

  window.addEventListener("DOMContentLoaded", () => {
    loadNotifications();
  });
</script>
