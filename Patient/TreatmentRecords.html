    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Custom style for the chart container to ensure responsiveness while maintaining aspect ratio */
        .tooth-chart-container {
            display: grid;
            grid-template-columns: repeat(17, minmax(0, 1fr)); /* 8 + 1 (gap) + 8 */
            gap: 0.25rem;
        }
        .tooth-chart-container > div:nth-child(9) {
            /* Midline separator */
            grid-column: 9 / span 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #d1d5db; /* gray-300 */
        }
        /* Grid for 8 teeth in a quadrant */
        .quadrant-grid {
            display: contents;
        }
        
        /* --- STYLIZED TOOTH SHAPE --- */
        .tooth-shape {
            /* Creates a shape with a very rounded top and a less rounded, more squarish base */
            border-radius: 60% 60% 15% 15% / 60% 60% 15% 15%;
            /* For upper arch, flip the shape vertically */
        }
        .upper-arch .tooth-shape {
             /* Flip upper arch buttons for anatomical correctness */
             transform: scaleY(-1);
             transform-origin: center center;
        }
        
        .tooth-button-inner {
            /* This div reverses the transformation so the content is upright */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }
        .upper-arch .tooth-button-inner {
            transform: scaleY(-1); /* Reverse transform for content */
        }
    </style>
</head>

// --- Auth Check ---
 async function checkAuth(redirect = true) {
            const storedFirstName = localStorage.getItem('userFirstName');
            const storedRole = localStorage.getItem('userRole');
            const storedEmail = localStorage.getItem('userEmail');
            const storedUserId = localStorage.getItem('userId'); 

            if (storedFirstName && storedRole && storedUserId) return { UserAccountID: storedUserId, FirstName: storedFirstName, Role: storedRole, Email: storedEmail };

            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session?.user) { if (redirect) window.location.href = "/Login.html"; return null; }

            const { data: userData } = await supabaseClient
                .from('UserAccount')
                .select('*')
                .eq('Email', session.user.email)
                .maybeSingle();

            if (!userData) { if (redirect) window.location.href = "/Login.html"; return null; }

            localStorage.setItem('userFirstName', userData.FirstName);
            localStorage.setItem('userRole', userData.Role);
            localStorage.setItem('userEmail', userData.Email);
            localStorage.setItem('userId', userData.UserAccountID); 
            
            return userData;
        }

// --- Tooth Button (IMPROVED VISUAL DESIGN) ---
function ToothButton({ number, status, onClick, isUpperArch }) {
    let baseStyles = "bg-white border-gray-300 text-gray-700 hover:border-gray-400 hover:bg-gray-50 shadow-md";
    let numberColor = "text-gray-700";
    let statusIndicatorClass = "";

    if (status === 'treatment') { 
        // Ring for clear selection boundary, Red background for treatment needed
        baseStyles = "bg-red-200 border-red-600 shadow-xl ring-2 ring-red-400"; 
        numberColor = "text-red-900"; 
        statusIndicatorClass = "bg-red-600"; 
    }
    if (status === 'completed') { 
        // Ring for clear selection boundary, Blue background for completed work
        baseStyles = "bg-blue-200 border-blue-600 shadow-xl ring-2 ring-blue-400";
        numberColor = "text-blue-900"; 
        statusIndicatorClass = "bg-blue-600"; 
    }

    return (
        <button 
            type="button" 
            onClick={e=>{ e.stopPropagation(); onClick(); }} 
            className={`w-full aspect-square transition-all duration-200 flex items-center justify-center relative border-2 
                       ${baseStyles} ${status ? 'transform scale-105 z-10' : 'hover:z-10'} tooth-shape`}
        >
            {/* Inner container to keep content upright even if the button is flipped (for upper arch) */}
            <div className="tooth-button-inner">
                {/* Tooth Number is the main, central element */}
                <span className={`text-xl font-bold ${numberColor}`}>{number}</span>
                
                {/* Status indicator dot */}
                {status && (
                    <div className={`absolute w-3 h-3 rounded-full border border-white shadow-md ${statusIndicatorClass}`}
                         style={{
                             // Position the indicator closer to the gum line (bottom of the button shape)
                             top: isUpperArch ? '70%' : '10%',
                             right: '10%'
                         }}
                    ></div>
                )}
            </div>
        </button>
    );
}

// --- Tooth Chart Grid Structure (Design Fixed) ---
function ToothChartGrid({ teethStatus, handleToothClick }) {
    // Quadrants for Universal Numbering System visualization:
    // Maxillary: Q1 (8->1), Midline, Q2 (9->16)
    // Mandibular: Q4 (32->25), Midline, Q3 (24->17)
    
    // Q1 (Upper Right, Patient Right): 8, 7, 6, 5, 4, 3, 2, 1
    const Q1 = [8, 7, 6, 5, 4, 3, 2, 1];
    // Q2 (Upper Left, Patient Left): 9, 10, 11, 12, 13, 14, 15, 16
    const Q2 = [9, 10, 11, 12, 13, 14, 15, 16];
    // Q4 (Lower Right, Patient Right): 32, 31, 30, 29, 28, 27, 26, 25
    const Q4 = [32, 31, 30, 29, 28, 27, 26, 25];
    // Q3 (Lower Left, Patient Left): 24, 23, 22, 21, 20, 19, 18, 17
    const Q3 = [24, 23, 22, 21, 20, 19, 18, 17];

    const renderQuadrant = (numbers, isUpperArch) => (
        <div className={`quadrant-grid ${isUpperArch ? 'upper-arch' : 'lower-arch'}`}>
            {numbers.map(n => (
                <ToothButton 
                    key={n} 
                    number={n} 
                    status={teethStatus[n]} 
                    onClick={() => handleToothClick(n)} 
                    isUpperArch={isUpperArch}
                />
            ))}
        </div>
    );

    return (
        <div className="bg-white p-4 rounded-xl border shadow-inner">
            <h4 className="text-center text-xs font-semibold text-gray-500 mb-2 uppercase tracking-widest">Maxillary Arch (Upper)</h4>
            <div className="tooth-chart-container">
                {/* Upper Right Quadrant (Q1) */}
                {renderQuadrant(Q1, true)}
                {/* Midline */}
                <div className="text-sm font-light text-gray-300">|</div>
                {/* Upper Left Quadrant (Q2) */}
                {renderQuadrant(Q2, true)}
            </div>

            <div className="w-full h-1 bg-gray-100 my-4 rounded-full"></div>

            <div className="tooth-chart-container">
                {/* Lower Right Quadrant (Q4) */}
                {renderQuadrant(Q4, false)}
                {/* Midline */}
                <div className="text-sm font-light text-gray-300">|</div>
                {/* Lower Left Quadrant (Q3) */}
                {renderQuadrant(Q3, false)}
            </div>
            <h4 className="text-center text-xs font-semibold text-gray-500 mt-2 uppercase tracking-widest">Mandibular Arch (Lower)</h4>
        </div>
    );
}


// --- Main Component ---
function TreatmentRecordsPage() {
    const [user, setUser] = useState(null);
    const [appointments, setAppointments] = useState([]);
    const [searchTerm, setSearchTerm] = useState("");
    const [selectedAppointment, setSelectedAppointment] = useState(null);
    const [teethStatus, setTeethStatus] = useState({});
    const [activeTool, setActiveTool] = useState('treatment');
    const [treatmentNotes, setTreatmentNotes] = useState('');
    const [treatmentDetails, setTreatmentDetails] = useState('');
    const [statusFilter, setStatusFilter] = useState('all');

    const [heightCm, setHeightCm] = useState('');
    const [weightKg, setWeightKg] = useState('');
    const [bloodType, setBloodType] = useState('');
    const [allergies, setAllergies] = useState('');
    const [medication, setMedication] = useState('');
    const [medicalConditions, setMedicalConditions] = useState('');
    const [medicalRecordNotes, setMedicalRecordNotes] = useState('');
    const [emergencyContactName, setEmergencyContactName] = useState('');
    const [emergencyContactNumber, setEmergencyContactNumber] = useState('');
    const [medicalRecord, setMedicalRecord] = useState(null);
    const viewOnly = (user?.Role || "").toLowerCase() === "patient";
    
    // --- Auth check ---
    useEffect(() => {
        checkAuth().then(u => setUser(u)).catch(err => console.error(err));
    }, []);

    // --- Fetch appointments (for all dentists now) ---
useEffect(() => {
  if (!user) return;

  let q = supabaseClient
    .from('Appointment')
    .select(`
      AppointmentID,
      UserAccountID,
      Service,
      Status,
      AppointmentSchedule,
      Patient:UserAccountID(FirstName, LastName, Email)
    `)
    .order('AppointmentSchedule', { ascending: false });

  // ✅ Patient can only see their own records
  if ((user.Role || "").toLowerCase() === "patient") {
    q = q.eq('UserAccountID', user.UserAccountID);
  }

  q.then(({ data, error }) => {
    if (error) console.error(error);
    else setAppointments(data || []);
  });
}, [user]);



    // --- Fetch TreatmentRecord + ToothChart when appointment is selected ---
  useEffect(() => {
    if (!selectedAppointment?.AppointmentID) return;

    let isMounted = true;

    const fetchData = async () => {
        try {
            const { data: trData } = await supabaseClient
                .from('TreatmentRecord')
                .select('*')
                .eq('AppointmentID', selectedAppointment.AppointmentID)
                .maybeSingle();

            if (!isMounted) return; // STOP if modal closed

            let teeth = {};
            if (trData?.TreatmentRecordID) {
                const { data: tcData } = await supabaseClient
                    .from('ToothChart')
                    .select('*')
                    .eq('TreatmentRecordID', trData.TreatmentRecordID)
                    .maybeSingle();

                if (!isMounted) return;

                teeth = tcData?.TeethStatus || {};
            }

            if (!isMounted) return;

            // --- Fetch MedicalRecord for this appointment ---
            const { data: mrData, error: mrError } = await supabaseClient
                .from('MedicalRecord')
                .select('*')
                .eq('AppointmentID', selectedAppointment.AppointmentID)
                .maybeSingle();

            if (!isMounted) return;

            if (mrError) {
                console.error(mrError);
            } else {
                setMedicalRecord(mrData || null);
                setHeightCm(mrData?.Height ?? '');
                setWeightKg(mrData?.Weight ?? '');
                setBloodType(mrData?.BloodType ?? '');
                setAllergies(mrData?.Allergies ?? '');
                setMedication(mrData?.Medication ?? '');
                setMedicalConditions(mrData?.MedicalConditions ?? '');
                setMedicalRecordNotes(mrData?.MedicalRecordNotes ?? '');
                setEmergencyContactName(mrData?.EmergencyContactName ?? '');
                setEmergencyContactNumber(mrData?.EmergencyContactNumber ?? '');
            }

            setTreatmentNotes(trData?.TreatmentNotes || '');
            setTreatmentDetails(trData?.TreatmentDetails || '');
            setTeethStatus(teeth);

        } catch (err) {
            console.error(err);
        }
    };

    fetchData();

    return () => {
        isMounted = false;
    };
}, [selectedAppointment]);

    // --- Handle tooth clicks (Unchanged) ---
const handleToothClick = (toothNumber) => {
  if (viewOnly) return; // ✅ patient cannot edit

  setTeethStatus(prev => {
    const newStatus = { ...prev };
    if (prev[toothNumber] === activeTool) delete newStatus[toothNumber];
    else newStatus[toothNumber] = activeTool;
    return newStatus;
  });
};


    // --- Close modal (Unchanged) ---
    const closeModal = () => {
        setSelectedAppointment(null);
        setTeethStatus({});
        setTreatmentNotes('');
        setTreatmentDetails('');
        setActiveTool('treatment');

        // medical
        setHeightCm('');
        setWeightKg('');
        setBloodType('');
        setAllergies('');
        setMedication('');
        setMedicalConditions('');
        setMedicalRecordNotes('');
        setEmergencyContactName('');
        setEmergencyContactNumber('');
        setMedicalRecord(null);
    };

    // --- Save Medical + Treatment + ToothChart (per appointment) ---
    const handleSave = async () => {
        if (!selectedAppointment?.AppointmentID) return;

        try {
            console.log("Saving medical + treatment record...");

            // 1) Upsert MedicalRecord by AppointmentID (one per appointment)
            const mrPayload = {
                AppointmentID: selectedAppointment.AppointmentID,
                UserAccountID: selectedAppointment.UserAccountID || selectedAppointment.Patient?.UserAccountID || selectedAppointment.Patient?.id, // fallback
                Height: heightCm === '' ? null : Number(heightCm),
                Weight: weightKg === '' ? null : Number(weightKg),
                BloodType: bloodType || null,
                Allergies: allergies || null,
                Medication: medication || null,
                MedicalConditions: medicalConditions || null,
                MedicalRecordNotes: medicalRecordNotes || null,
                EmergencyContactName: emergencyContactName || null,
                EmergencyContactNumber: emergencyContactNumber || null,
                UpdatedAt: new Date().toISOString()
            };

            // Resolve UserAccountID reliably (from appointment query doesn't include it currently, so we derive from Patient relation)
            // If your Appointment select does not expose patient UserAccountID, update that query to include it.
            if (!mrPayload.UserAccountID && selectedAppointment.Patient?.Email) {
                // Best-effort: medical record still saves without UserAccountID if DB allows NULL, but you likely want it filled.
                console.warn("UserAccountID not resolved for MedicalRecord; consider including UserAccountID in Appointment select.");
            }

            const { data: existingMR } = await supabaseClient
                .from('MedicalRecord')
                .select('MedicalRecordID')
                .eq('AppointmentID', selectedAppointment.AppointmentID)
                .maybeSingle();

            if (existingMR?.MedicalRecordID) {
                const { error: mrUpdErr } = await supabaseClient
                    .from('MedicalRecord')
                    .update(mrPayload)
                    .eq('AppointmentID', selectedAppointment.AppointmentID);

                if (mrUpdErr) {
                    console.error("Error updating MedicalRecord:", mrUpdErr);
                    showMessage("Failed to save medical record.", "error");
                    return;
                }
            } else {
                const { error: mrInsErr } = await supabaseClient
                    .from('MedicalRecord')
                    .insert({
                        MedicalRecordID: crypto.randomUUID(),
                        CreatedAt: new Date().toISOString(),
                        ...mrPayload
                    });

                if (mrInsErr) {
                    console.error("Error inserting MedicalRecord:", mrInsErr);
                    showMessage("Failed to save medical record.", "error");
                    return;
                }
            }

            // 2) Upsert TreatmentRecord by AppointmentID (one per appointment)
            const hasTreatmentContent = (treatmentNotes || '').trim() || (treatmentDetails || '').trim();
            if (!hasTreatmentContent) {
                showMessage("Please enter Treatment Notes or Treatment Details.", "error");
                return;
            }

            const { data: existingTR } = await supabaseClient
                .from('TreatmentRecord')
                .select('TreatmentRecordID')
                .eq('AppointmentID', selectedAppointment.AppointmentID)
                .maybeSingle();

            let trId = existingTR?.TreatmentRecordID;

            if (trId) {
                const { error: trUpdErr } = await supabaseClient
                    .from('TreatmentRecord')
                    .update({
                        TreatmentNotes: treatmentNotes,
                        TreatmentDetails: treatmentDetails
                    })
                    .eq('AppointmentID', selectedAppointment.AppointmentID);

                if (trUpdErr) {
                    console.error("Error updating TreatmentRecord:", trUpdErr);
                    showMessage("Failed to save treatment record.", "error");
                    return;
                }
            } else {
                trId = crypto.randomUUID();
                const { error: trInsErr } = await supabaseClient
                    .from('TreatmentRecord')
                    .insert({
                        TreatmentRecordID: trId,
                        AppointmentID: selectedAppointment.AppointmentID,
                        TreatmentNotes: treatmentNotes,
                        TreatmentDetails: treatmentDetails
                    });

                if (trInsErr) {
                    console.error("Error inserting TreatmentRecord:", trInsErr);
                    showMessage("Failed to save treatment record.", "error");
                    return;
                }
            }

            // 3) Upsert ToothChart by TreatmentRecordID
            const { error: tcErr } = await supabaseClient
                .from('ToothChart')
                .upsert(
                    { TreatmentRecordID: trId, TeethStatus: teethStatus },
                    { onConflict: ['TreatmentRecordID'] }
                );

            if (tcErr) {
                console.error("Error saving ToothChart:", tcErr);
                showMessage("Failed to save tooth chart.", "error");
                return;
            }

            showMessage("Record saved successfully!", "success");
            closeModal();
        } catch (err) {
            console.error("Unexpected error:", err);
            showMessage("Unexpected error while saving.", "error");
        }
    };

    const getStatusStyles = (status) => {
    const s = (status || '').toLowerCase();

    if (s === 'finished' || s === 'completed') {
        return { bg: 'bg-green-100', text: 'text-green-800', border: 'border-green-200' };
    }
    if (s === 'approved') {
        return { bg: 'bg-blue-100', text: 'text-blue-800', border: 'border-blue-200' };
    }
    if (s === 'pending') {
        return { bg: 'bg-yellow-100', text: 'text-yellow-800', border: 'border-yellow-200' };
    }
    if (s === 'cancelled' || s === 'canceled') {
        return { bg: 'bg-red-100', text: 'text-red-800', border: 'border-red-200' };
    }

    return { bg: 'bg-gray-100', text: 'text-gray-700', border: 'border-gray-200' };
};

    const getTeethByStatus = status =>
        Object.entries(teethStatus)
             .filter(([_, s]) => s === status)
             .map(([t, _]) => t)
             .sort((a,b) => a-b);

    const now = new Date();
const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
const endOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);

// --- Search + filter (by patient, service, today, finished) ---
const filteredAppointments = appointments.filter((a) => {
    const term = searchTerm.trim().toLowerCase();

    // search by patient name or service
    if (term) {
        const patientName = a.Patient
            ? `${a.Patient.FirstName || ''} ${a.Patient.LastName || ''}`.toLowerCase()
            : '';
        const serviceName = (a.Service || '').toLowerCase();

        if (
            !patientName.includes(term) &&
            !serviceName.includes(term)
        ) {
            return false;
        }
    }

    // filter by status range
    if (statusFilter === 'finished') {
        return a.Status === 'Finished';
    }

    if (statusFilter === 'today') {
        const d = new Date(a.AppointmentSchedule);
        if (isNaN(d)) return false;
        return d >= startOfToday && d < endOfToday;
    }

    // "all"
    return true;
});

    // --- ESC to close modal (Unchanged) ---
    useEffect(() => {
        const handleEsc = e => { if(e.key === 'Escape') closeModal(); };
        window.addEventListener('keydown', handleEsc);
        return () => window.removeEventListener('keydown', handleEsc);
    }, []);

    // --- Reset active tool if modal closes (Unchanged) ---
    useEffect(() => {
        if(!selectedAppointment) setActiveTool('treatment');
    }, [selectedAppointment]);

    return (
        <div className="min-h-screen bg-gray-50">
            {/* --- Header (Unchanged) --- */}
            <header className="bg-[#03555E] text-white shadow-md">
                <div className="container mx-auto px-4 py-4 flex items-center gap-4">
                    <a href="Dashboard.html" className="no-underline">
                        <Button variant="ghost" size="sm" className="text-white hover:bg-[#024449]">
                            <ArrowLeft className="w-4 h-4 mr-2" />
                            Back
                        </Button>
                    </a>
                    <div>
                        <h1 className="text-xl font-bold">Treatment Records</h1>
                        <p className="text-sm opacity-90">Record patient treatments</p>
                    </div>
                </div>
            </header>

            {/* --- Search & Appointments (Unchanged) --- */}
            <div className="container mx-auto px-4 py-8">
                <Card className="mb-6 border-none shadow-md">
                    <CardHeader>
                        <CardTitle>Search Appointments</CardTitle>
                    </CardHeader>
                    <CardContent>
    <div className="flex flex-col lg:flex-row gap-2">
        {/* Search box */}
        <div className="flex-1 relative">
            <Search className="absolute left-3 top-3 w-4 h-4 text-gray-400" />
            <Input
                placeholder="Search by patient or service..."
                value={searchTerm}
                onChange={(e) => setSearchTerm(e.target.value)}
                className="pl-10"
            />
        </div>

        {/* Filters + button */}
        <div className="flex gap-2 lg:items-center">
            <select
                className="h-10 rounded-md border border-gray-300 bg-white px-3 text-sm text-gray-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#03555E]"
                value={statusFilter}
                onChange={(e) => setStatusFilter(e.target.value)}
            >
                <option value="all">All appointments</option>
                <option value="today">Today's appointments</option>
                <option value="finished">Finished only</option>
            </select>

            <Button
                type="button"
                className="bg-[#03555E] hover:bg-[#024449] w-full sm:w-auto"
            >
                Search
            </Button>
        </div>
    </div>
</CardContent>
                </Card>

               <div className="space-y-4">
    {filteredAppointments.length > 0 ? (
        filteredAppointments.map((a) => {
            const statusStyles = getStatusStyles(a.Status);
            const patientName = a.Patient
                ? `${a.Patient.FirstName} ${a.Patient.LastName}`
                : 'Unknown Patient';

            return (
                <Card
                    key={a.AppointmentID}  // ✅ use real ID, not a.id
                    className="cursor-pointer hover:shadow-lg transition-all duration-200 border-none shadow-sm"
                    onClick={() => setSelectedAppointment(a)}
                >
                    <CardContent className="pt-6">
                        <div className="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
                            <div className="flex-1">
                                {/* Patient Name */}
                                <h3 className="text-lg font-bold text-gray-900 mb-1">
                                    {patientName}
                                </h3>

                                {/* Service */}
                                <p className="text-[#03555E] font-medium mb-3">
                                    {a.Service}
                                </p>

                                {/* Appointment Details */}
                                <div className="flex flex-wrap gap-4 md:gap-6 text-sm text-gray-600">
                                    <div className="flex items-center gap-1 bg-gray-100 px-2 py-1 rounded">
                                        <Calendar className="w-4 h-4" />
                                        {new Date(a.AppointmentSchedule).toLocaleDateString()}
                                    </div>
                                    <div className="flex items-center gap-1 bg-gray-100 px-2 py-1 rounded">
                                        <span>⏰</span>
                                        {new Date(a.AppointmentSchedule).toLocaleTimeString([], {
                                            hour: '2-digit',
                                            minute: '2-digit',
                                        })}
                                    </div>
                                </div>
                            </div>

                            {/* Status & Actions */}
                            <div className="flex items-center justify-between md:justify-end gap-3 w-full md:w-auto mt-2 md:mt-0">
                                <span
                                    className={`px-3 py-1 rounded-full text-sm font-medium flex items-center gap-1 border ${statusStyles.bg} ${statusStyles.text} ${statusStyles.border}`}
                                >
                                    <CheckCircle className="w-4 h-4" />
                                    {a.Status || 'Pending'}
                                </span>
                                <Button className="bg-[#03555E] hover:bg-[#024449] text-xs md:text-sm">
                                    View Details
                                </Button>
                            </div>
                        </div>
                    </CardContent>
                </Card>
            );
        })
    ) : (
        <Card>
            <CardContent className="pt-12">
                <div className="text-center py-8 text-gray-500">
                    <Calendar className="w-16 h-16 mx-auto mb-4 opacity-20" />
                    <h3 className="text-lg font-medium mb-2">No appointments found</h3>
                    <p className="text-sm">
                        {statusFilter === 'today'
                            ? "No appointments scheduled for today."
                            : statusFilter === 'finished'
                            ? "No finished appointments found."
                            : "Try adjusting your search terms."}
                    </p>
                </div>
            </CardContent>
        </Card>
    )}
</div>

            </div>

            {/* --- Modal for Treatment --- */}
            {selectedAppointment && (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-in fade-in duration-200">
                    <Card className="w-full max-w-4xl max-h-[95vh] overflow-y-auto shadow-2xl flex flex-col">
                        <CardHeader className="flex flex-row items-center justify-between sticky top-0 bg-white border-b z-10 py-4">
                            <div>
                                <CardTitle className="text-xl text-[#03555E]">
                                    {selectedAppointment.Patient ? `${selectedAppointment.Patient.FirstName} ${selectedAppointment.Patient.LastName}` : "Unknown Patient"}
                                </CardTitle>
                                <p className="text-sm text-gray-600 mt-1 font-medium">{selectedAppointment.Service}</p>
                            </div>
                              <button
                            onClick={closeModal}
                            className="absolute top-3 right-3 p-2 rounded-full hover:bg-gray-100 text-gray-500 hover:text-gray-900 transition-colors"
                            >
                            <X className="w-5 h-5" />
                            </button>
                        </CardHeader>

                        <CardContent className="space-y-6 pt-6 pb-8">

{/* Medical Record (view-only) */}
<div className="border p-4 rounded-xl bg-white shadow-sm">
    <div className="flex items-start justify-between gap-3 mb-3">
        <div>
            <label className="block text-sm font-bold text-gray-700">Medical Record</label>
            <p className="text-xs text-gray-500 mt-0.5">
                This is a snapshot recorded during your appointment.
            </p>
        </div>
    </div>

    {medicalRecord ? (
        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Height</p>
                <p className="mt-1 text-sm text-gray-900">
                    {medicalRecord.Height ? `${medicalRecord.Height} cm` : '—'}
                </p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Weight</p>
                <p className="mt-1 text-sm text-gray-900">
                    {medicalRecord.Weight ? `${medicalRecord.Weight} kg` : '—'}
                </p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Blood Type</p>
                <p className="mt-1 text-sm text-gray-900">{medicalRecord.BloodType || '—'}</p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Allergies</p>
                <p className="mt-1 text-sm text-gray-900">{medicalRecord.Allergies || '—'}</p>
            </div>

            <div className="p-3 rounded-lg bg-gray-50 border sm:col-span-2">
                <p className="text-[11px] font-semibold text-gray-600">Medication</p>
                <p className="mt-1 text-sm text-gray-900 whitespace-pre-wrap">{medicalRecord.Medication || '—'}</p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border sm:col-span-2">
                <p className="text-[11px] font-semibold text-gray-600">Medical Conditions</p>
                <p className="mt-1 text-sm text-gray-900 whitespace-pre-wrap">{medicalRecord.MedicalConditions || '—'}</p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border sm:col-span-2">
                <p className="text-[11px] font-semibold text-gray-600">Medical Record Notes</p>
                <p className="mt-1 text-sm text-gray-900 whitespace-pre-wrap">{medicalRecord.MedicalRecordNotes || '—'}</p>
            </div>

            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Emergency Contact Name</p>
                <p className="mt-1 text-sm text-gray-900">{medicalRecord.EmergencyContactName || '—'}</p>
            </div>
            <div className="p-3 rounded-lg bg-gray-50 border">
                <p className="text-[11px] font-semibold text-gray-600">Emergency Contact Number</p>
                <p className="mt-1 text-sm text-gray-900">{medicalRecord.EmergencyContactNumber || '—'}</p>
            </div>
        </div>
    ) : (
        <p className="text-sm text-gray-500">No medical record was recorded for this appointment.</p>
    )}
</div>

                            {/* Medical Record (per appointment) */}
                            {/* Treatment Notes */}
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Treatment Notes</label>
                                    <Textarea
                                    placeholder="—"
                                    className="min-h-[100px] border-gray-300 focus:border-[#03555E] focus:ring-[#03555E]"
                                    value={treatmentNotes}
                                    onChange={viewOnly ? undefined : (e) => setTreatmentNotes(e.target.value)}
                                    readOnly={viewOnly}
                                    disabled={viewOnly}
                                    />
                            </div>
                            <div>
                                <label className="block text-sm font-bold text-gray-700 mb-2">Treatment Details</label>
                                    <Textarea
                                    placeholder="—"
                                    className="min-h-[100px] border-gray-300 focus:border-[#03555E] focus:ring-[#03555E]"
                                    value={treatmentDetails}
                                    onChange={viewOnly ? undefined : (e) => setTreatmentDetails(e.target.value)}
                                    readOnly={viewOnly}
                                    disabled={viewOnly}
                                    />
                            </div>

                            {/* Tooth Chart Section (DESIGN FIXED) */}
                            <div className="border p-4 rounded-xl bg-gray-50">
                                <div className="flex flex-col sm:flex-row sm:items-center justify-between mb-4 gap-4">
                                    <label className="block text-sm font-bold text-gray-700">Mark Tooth Status</label>
                                        {!viewOnly && (
                                        <div className="flex bg-white p-1 rounded-lg self-start sm:self-auto shadow-sm border">
                                        <button onClick={()=>setActiveTool('treatment')} className={`${activeTool==='treatment'?'bg-red-600 text-white shadow-md':'text-gray-600 hover:bg-gray-100'} px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors`}>
                                            <span className="w-3 h-3 rounded-full bg-white border-2 border-red-600 box-content"></span> Treatment Needed
                                        </button>
                                        <button onClick={()=>setActiveTool('completed')} className={`${activeTool==='completed'?'bg-blue-600 text-white shadow-md':'text-gray-600 hover:bg-gray-100'} px-4 py-1.5 rounded-md text-sm font-medium flex items-center gap-2 transition-colors`}>
                                            <span className="w-3 h-3 rounded-full bg-white border-2 border-blue-600 box-content"></span> Completed
                                        </button>
                                    </div>)}
                                    </div>

                                {/* RENDER NEW CHART */}
                                <ToothChartGrid teethStatus={teethStatus} handleToothClick={handleToothClick} />
                                
                                <div className="mt-6 p-4 bg-white rounded-lg border">
                                    <h4 className="font-bold text-base mb-2">Summary</h4>
                                    <p className="text-sm text-gray-700 mb-1">
                                        <span className="font-semibold text-red-600">Treatment:</span> {getTeethByStatus('treatment').join(', ') || 'None'}
                                    </p>
                                    <p className="text-sm text-gray-700">
                                        <span className="font-semibold text-blue-600">Completed:</span> {getTeethByStatus('completed').join(', ') || 'None'}
                                    </p>
                                </div>
                            </div>

                            <div className="flex justify-end gap-4 pt-4">
                                <Button variant="outline" onClick={closeModal}>Cancel</Button>
                                {!viewOnly && (
                                    <Button onClick={handleSave}>Save Record</Button>
                                )}
                            </div>
                        </CardContent>
                    </Card>
                </div>
            )}

        </div>
    );

}
function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

ReactDOM.createRoot(document.getElementById('root')).render(<TreatmentRecordsPage />);

</script>
<div id="messageBox"
                    class="hidden fixed bottom-6 right-6 p-4 rounded text-white font-medium shadow-lg z-50 transition-all duration-300">
                    </div>
</body>
</html>
