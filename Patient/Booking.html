  async function checkAuth(redirect = true) {
  const storedFirstName = localStorage.getItem('userFirstName');
  const storedRole = localStorage.getItem('userRole');
  const storedEmail = localStorage.getItem('userEmail');

  if (storedFirstName && storedRole) {
    return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail };
  }

  const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
  if (sessionError) console.error(sessionError);

  if (!session?.user) {
    if (redirect) window.location.href = "/Login.html";
    return null;
  }

  const { data: userData, error } = await supabaseClient
    .from('UserAccount')
    .select('*')
    .eq('Email', session.user.email)
    .maybeSingle();

  if (error || !userData) {
    console.error(error || "No user data found");
    if (redirect) window.location.href = "/Login.html";
    return null;
  }

  localStorage.setItem('userFirstName', userData.FirstName);
  localStorage.setItem('userRole', userData.Role);
  localStorage.setItem('userEmail', userData.Email);
  localStorage.setItem('userId', session.user.id);

  return userData;
}

async function getBookedAppointments(dentistUserAccountId, dateYmd) {
  if (!dentistUserAccountId || !dateYmd) return [];

  // start and end of day in Manila
  const startUTC = new Date(`${dateYmd}T00:00:00+08:00`).toISOString();
  const endUTC = new Date(`${dateYmd}T23:59:59+08:00`).toISOString();

  const { data, error } = await supabaseClient
    .from('Appointment')
    .select('AppointmentID, AppointmentSchedule, endschedule, ServiceType, Status')
    .eq('DentistID', dentistUserAccountId)
    .in('Status', [
      'Pending',
      'Approved',
      'Finished',
      'Rescheduled',
      'RescheduleRequested',
      'CancelRequested'
    ])
    .gte('AppointmentSchedule', startUTC)
    .lte('AppointmentSchedule', endUTC);

  if (error) {
    console.error('Error fetching booked appointments:', error);
    return [];
  }

  // normalize: each item => { appointmentId, startISO, endISO, displayStart }
  return (data || []).map(row => {
    const startISO = row.AppointmentSchedule;
const startDt = new Date(startISO);

// ✅ prefer real endschedule from DB
let endDt = row.endschedule ? new Date(row.endschedule) : null;

// fallback if missing/invalid
if (!endDt || isNaN(endDt) || +endDt <= +startDt) {
  // fallback estimate from ServiceType ids
  const ids = (row.ServiceType || "")
    .toString()
    .split(',')
    .map(x => parseInt(x))
    .filter(Boolean);

  let durationMinutes = 0;
  if (ids.length) {
    ids.forEach(id => {
      const svc = getServiceById(id);
      if (svc) durationMinutes += svc.durationMinutes || 0;
    });
  } else {
    durationMinutes = 60;
  }

  endDt = new Date(startDt.getTime() + durationMinutes * 60000);
}

return {
  appointmentId: row.AppointmentID,
  startISO,
  endISO: endDt.toISOString(),
  startDt,
  endDt,
  status: row.Status
};

  });
}

     // ---------- REPLACE renderTimeSlots ----------
function renderTimeSlots() {
  const { selectedDate, selectedDentist, bookedAppointments, selectedTime } = state;

  const totalMinutes =
    computeTotalDurationMinutes(state.selectedServices) +
    (state.selectedAddOns || []).reduce((sum, a) => sum + (a.durationMinutes || 0), 0);

  // Manila "today" in YYYY-MM-DD
  const todayYmd = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });
  const isToday = selectedDate === todayYmd;

  // current time in Manila (+ 1 hour rule)
  const nowManila = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" }));
  const nowPlusOneHourManila = new Date(nowManila.getTime() + 60 * 60000);

  return timeSlots.map(time => {
    let candidateStart = null;
    let candidateEnd = null;

    if (selectedDate && totalMinutes > 0) {
      candidateStart = makeManilaDateTime(selectedDate, time);
      candidateEnd = new Date(candidateStart.getTime() + totalMinutes * 60000);
    }

    // overlap check vs bookedAppointments (dentist-specific list)
    let isBooked = false;
    if (bookedAppointments && candidateStart && candidateEnd) {
      for (const appt of bookedAppointments) {
        if (intervalsOverlap(candidateStart, candidateEnd, appt.startDt, appt.endDt)) {
          isBooked = true;
          break;
        }
      }
    }

    // "today" lead-time rule
    let isTooSoonToday = false;
    if (isToday && candidateStart && candidateStart <= nowPlusOneHourManila) {
      isTooSoonToday = true;
    }

    const disabled =
      !(state.selectedServices && state.selectedServices.length) ||   // ✅ at least one service
      !selectedDentist ||
      !selectedDate ||
      totalMinutes <= 0 ||
      isBooked ||
      isTooSoonToday;

    const isActive = selectedTime === time;

    return `
      <button
        class="p-3 border rounded-lg text-sm
          ${isActive && !disabled ? "border-primary bg-primary text-white" : ""}
          ${!isActive && !disabled ? "border-gray-200 hover:border-primary/50" : ""}
          ${disabled ? "bg-gray-200 text-gray-400 cursor-not-allowed border-gray-200" : ""}"
        ${disabled ? "disabled" : `onclick="setSelectedTime('${time}')"`}>
        ${time}
      </button>
    `;
  }).join("");
}

function getIncompatibleServiceIds(selectedServices) {
  const incompatibleIds = new Set();
  const selectedIds = (selectedServices || []).map(s => s.id);

  for (const svc of services) {
    if (selectedIds.includes(svc.id)) continue;

    for (const selId of selectedIds) {
      const a = incompatibleById[selId] || [];
      const b = incompatibleById[svc.id] || [];
      if (a.includes(svc.id) || b.includes(selId)) {
        incompatibleIds.add(svc.id);
        break;
      }
    }
  }
  return incompatibleIds;
}

// compute total minutes for currently selected services
function computeTotalDurationMinutes(selectedServices) {
  return (selectedServices || []).reduce((sum, s) => sum + (s.durationMinutes || 0), 0);
}

// given YYYY-MM-DD and time string like "9:00 AM", return a Date in Manila timezone
function makeManilaDateTime(dateYmd, timeStr) {
  const [hours, minutes] = timeStringTo24h(timeStr).split(':').map(Number);
  // create a base at midnight Manila by building with UTC then offsetting
  const parts = dateYmd.split('-').map(Number); // [YYYY,MM,DD]
  const year = parts[0], month = parts[1] - 1, day = parts[2];
  // construct a Date in Manila by interpreting as local to Manila: use Date.UTC then subtract timezone difference
  const dt = new Date(Date.UTC(year, month, day, hours - 8, minutes, 0)); // convert Manila (UTC+8) to UTC by subtracting 8 hours
  return dt;
}

// overlap check for two intervals [s1,e1) and [s2,e2)
function intervalsOverlap(s1, e1, s2, e2) {
  return (s1 < e2) && (e1 > s2);
}

    // --- Helpers ---
    function timeStringTo24h(timeStr) {
      // e.g. "9:00 AM" -> "09:00:00"
      const [time, modifier] = timeStr.split(" ");
      let [hours, minutes] = time.split(":").map(Number);
      if (modifier === "PM" && hours !== 12) hours += 12;
      if (modifier === "AM" && hours === 12) hours = 0;
      return `${hours.toString().padStart(2,'0')}:${minutes.toString().padStart(2,'0')}:00`;
    }

const generateCalendarDays = (currentMonth) => {
  const year = currentMonth.getFullYear();
  const month = currentMonth.getMonth();

  const firstDayLocal = new Date(year, month, 1);
  const lastDayLocal = new Date(year, month + 1, 0);
  const daysInMonth = lastDayLocal.getDate();
  const startingDayOfWeek = firstDayLocal.getDay(); // 0=Sun

  // Manila "today" as YYYY-MM-DD string
  const todayYmd = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });

  const days = [];
  for (let i = 0; i < startingDayOfWeek; i++) days.push(null);

  for (let d = 1; d <= daysInMonth; d++) {
    // Always build a real Date object for this day, then compute Manila strings from it
    const dateObjUTC = new Date(Date.UTC(year, month, d));
    const dateYmd = dateObjUTC.toLocaleDateString("en-CA", { timeZone: "Asia/Manila" }); // YYYY-MM-DD

    const isPast = dateYmd < todayYmd;
    const isToday = dateYmd === todayYmd;

    days.push({
      day: d,
      date: dateYmd,
      isPast,
      isToday,
      fullDate: dateObjUTC.toLocaleDateString("en-US", {
        weekday: "long",
        month: "long",
        day: "numeric",
        year: "numeric",
        timeZone: "Asia/Manila",
      }),
    });
  }

  return days;
};

function isAnySlotAvailableForDateDentistOnly(dateYmd, bookedAppointments) {
  if (!state.selectedDentist) return true;

  // ✅ bookedAppointments already has startDt/endDt from getBookedAppointments()
  const intervals = (bookedAppointments || [])
    .filter(a => a.startDt && a.endDt && !isNaN(a.startDt) && !isNaN(a.endDt))
    .map(a => ({ start: a.startDt, end: a.endDt }));

  const nowManila = new Date(
    new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" })
  );
  const nowPlus1h = new Date(nowManila.getTime() + 60 * 60000);
  const todayYmd = nowManila.toLocaleDateString("en-CA");
  const isToday = dateYmd === todayYmd;

  // For each slot, check if its START TIME is free (not inside any booked interval)
  for (const label of timeSlots) {
    const slotStart = makeManilaDateTime(dateYmd, label);

    // block "too soon" slots for today
    if (isToday && slotStart <= nowPlus1h) continue;

    const startIsBlocked = intervals.some(b =>
      slotStart >= b.start && slotStart < b.end
    );

    if (!startIsBlocked) return true; // at least one free slot start time
  }

  return false; // every slot start is blocked
}

function isAnySlotAvailableForDate(dateYmd, bookedAppointments) {
  const totalMinutes =
  computeTotalDurationMinutes(state.selectedServices) +
  (state.selectedAddOns || []).reduce((sum,a)=>sum+(a.durationMinutes||0),0);
  if (!state.selectedDentist || !dateYmd || !totalMinutes) return true; // don't block calendar yet

  // today lead time handling
  const todayYmd = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });
  const isToday = dateYmd === todayYmd;
  const nowManila = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" }));
  const nowPlusOneHourManila = new Date(nowManila.getTime() + 60 * 60000);

  for (const time of timeSlots) {
    const start = makeManilaDateTime(dateYmd, time);
    const end = new Date(start.getTime() + totalMinutes * 60000);

    if (isToday && start <= nowPlusOneHourManila) continue;

    let booked = false;
    for (const appt of (bookedAppointments || [])) {
      if (intervalsOverlap(start, end, appt.startDt, appt.endDt)) {
        booked = true;
        break;
      }
    }
    if (!booked) return true;
  }
  return false;
}

async function refreshMonthAvailability(monthDate = state.currentMonth) {
  if (!state.selectedDentist) {
    setState({ monthAvailability: {} });
    return;
  }

  const y = monthDate.getFullYear();
  const m = monthDate.getMonth();

  // Month start/end in Manila calendar
  const monthStartUTC = new Date(Date.UTC(y, m, 1, 0, 0, 0));
  const monthEndUTC = new Date(Date.UTC(y, m + 1, 0, 23, 59, 59));

  // ✅ One query for the whole month
  const { data, error } = await supabaseClient
    .from("Appointment")
    .select("AppointmentID, AppointmentSchedule, endschedule, Status")
    .eq("DentistID", state.selectedDentist.userAccountId)
    .in("Status", [
      "Pending",
      "Approved",
      "Finished",
      "Rescheduled",
      "RescheduleRequested",
      "CancelRequested"
    ])
    .gte("AppointmentSchedule", monthStartUTC.toISOString())
    .lte("AppointmentSchedule", monthEndUTC.toISOString());

  if (error) {
    console.error("refreshMonthAvailability error:", error);
    setState({ monthAvailability: {} });
    return;
  }

  // Group appointments by Manila date YYYY-MM-DD
  const grouped = {};
  (data || []).forEach(row => {
    const startDt = new Date(row.AppointmentSchedule);
    let endDt = row.endschedule ? new Date(row.endschedule) : null;
    if (!endDt || isNaN(endDt) || +endDt <= +startDt) {
      endDt = new Date(startDt.getTime() + 60 * 60000);
    }

    const dateYmd = startDt.toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });
    if (!grouped[dateYmd]) grouped[dateYmd] = [];
    grouped[dateYmd].push({ startDt, endDt });
  });

  const nowManila = new Date(new Date().toLocaleString("en-US", { timeZone: "Asia/Manila" }));
  const nowPlus1h = new Date(nowManila.getTime() + 60 * 60000);
  const todayYmd = nowManila.toLocaleDateString("en-CA");

  // Build availability map for all days in month
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const availMap = {};

  for (let day = 1; day <= daysInMonth; day++) {
    const dateObjUTC = new Date(Date.UTC(y, m, day));
    const dateYmd = dateObjUTC.toLocaleDateString("en-CA", { timeZone: "Asia/Manila" });

    const intervals = grouped[dateYmd] || [];
    const isToday = dateYmd === todayYmd;

    let anyAvailable = false;

    for (const label of timeSlots) {
      const slotStart = makeManilaDateTime(dateYmd, label);

      if (isToday && slotStart <= nowPlus1h) continue;

      const blocked = intervals.some(b => slotStart >= b.startDt && slotStart < b.endDt);
      if (!blocked) {
        anyAvailable = true;
        break;
      }
    }

    availMap[dateYmd] = { anyAvailable };
  }

  setState({ monthAvailability: availMap });
}

window.toggleService = (serviceId) => {
  const fullService = services.find(s => s.id === serviceId);
  if (!fullService) return;

  const selected = state.selectedServices || [];
  const isSelected = selected.some(s => s.id === fullService.id);

  let updatedServices;

  if (isSelected) {
    // remove
    updatedServices = selected.filter(s => s.id !== fullService.id);
  } else {
    // add with compatibility check (ID-based)
    for (const sel of selected) {
      const a = incompatibleById[sel.id] || [];
      const b = incompatibleById[fullService.id] || [];
      if (a.includes(fullService.id) || b.includes(sel.id)) {
        showMessage(`${fullService.name} cannot be booked with ${sel.name}.`, "error", 4000);
        return;
      }
    }
    updatedServices = [...selected, fullService];
  }

  // ✅ clean add-ons that are no longer allowed after service change
  const allowed = getAllowedAddOnIdsForSelectedServices(updatedServices);
  const cleanedAddOns = (state.selectedAddOns || []).filter(a => allowed.has(a.id));

  // ✅ update state ONCE (reset time because duration changed)
  setState({
    selectedServices: updatedServices,
    selectedAddOns: cleanedAddOns,
    selectedTime: ""
  });

  // ✅ refresh dentist-specific bookings if dentist+date already chosen
  if (state.selectedDentist && state.selectedDate) {
    getBookedAppointments(state.selectedDentist.userAccountId, state.selectedDate)
      .then(booked => setState({ bookedAppointments: booked }));
  }
};

  const totalMinutes =
    computeTotalDurationMinutes(state.selectedServices) +
    (state.selectedAddOns || []).reduce((sum, a) => sum + (a.durationMinutes || 0), 0);

  if (!totalMinutes || totalMinutes <= 0) {
    showMessage("Invalid service duration. Please reselect your services.", "error");
    return;
  }

  const candidateStart = makeManilaDateTime(state.selectedDate, time);
  const candidateEnd = new Date(candidateStart.getTime() + totalMinutes * 60000);

  for (const appt of (state.bookedAppointments || [])) {
    if (intervalsOverlap(candidateStart, candidateEnd, appt.startDt, appt.endDt)) {
      showMessage("Selected time conflicts with an existing appointment. Please choose another time.", "error");
      return;
    }
  }

  setState({ selectedTime: time });
};

function generateTransactionId() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  const s = String(now.getSeconds()).padStart(2, '0');
  const rand = Math.floor(1000 + Math.random() * 9000);
  return `TXN-${y}${m}${d}-${h}${min}${s}-${rand}`;
}

// Open Modal
function openTransactionModal(data) {
  document.getElementById("modalTransactionId").textContent = data.transactionId;
  document.getElementById("modalDate").textContent = data.date;
  document.getElementById("modalTime").textContent = data.time;
  document.getElementById("modalDentist").textContent = data.dentist;

  document.getElementById("modalServices").innerHTML =
    data.services.map(s => `<div>• ${s}</div>`).join('');

  // ✅ NEW → Update downpayment amount
  if (document.getElementById("modalDownpayment")) {
    document.getElementById("modalDownpayment").textContent =
      (data.downpayment ?? 0).toLocaleString();
  }

  document.getElementById("transactionModal").classList.remove("hidden");
  document.getElementById("transactionModal").classList.add("flex");
}

// Close Modal
function closeTransactionModal() {
  const modal = document.getElementById("transactionModal");
  modal.classList.add("hidden");
  modal.classList.remove("flex");
}

function computeEstimatedDurationMinutes(mainSvc, addOnList) {
  const main = mainSvc ? (mainSvc.durationMinutes || 0) : 0;
  const add = (addOnList || []).reduce((sum,a)=>sum+(a.durationMinutes||0),0);
  return main + add;
}

function computeEstimatedTotal(mainSvc, addOnList) {
  const main = mainSvc ? (mainSvc.basePrice || 0) : 0;
  const add = (addOnList || []).reduce((sum,a)=>sum+(a.price||0),0);
  return main + add;
}

    // --- Booking handler (upload + insert) ---
window.confirmBooking = async () => {
  // 🔹 1. Ensure user is logged in
  let userId = localStorage.getItem('userId');

  if (!userId) {
    const { data: { session } } = await supabaseClient.auth.getSession();
    if (session?.user?.id) userId = session.user.id;
  }

  if (!userId) {
    showMessage("You must be logged in to book an appointment.", "error");
    return;
  }

  // 🔹 2. Policy checkbox validation
  const agreeEl = document.getElementById("policyAgree");
  if (!agreeEl || !agreeEl.checked) {
    showMessage("Please read and agree to the clinic policies before confirming your booking.", "error");
    return;
  }

  // 🔹 3. Receipt upload validation
  const receiptInput = document.getElementById("receiptInput");
  const hasFileInState = !!state.receiptFile;
  const hasFileInDom = receiptInput && receiptInput.files && receiptInput.files.length > 0;

  if (!hasFileInState && !hasFileInDom) {
    showMessage("Please upload a photo or screenshot of your GCash payment receipt.", "error");
    return;
  }

  // 🔹 4. Basic booking validations (NEW FLOW)
if (!state.selectedServices || !state.selectedServices.length) {
  showMessage("Please select at least one service.", "error");
  return;
}
  if (!state.selectedDentist) {
    showMessage("Please select a dentist.", "error");
    return;
  }
  if (!state.selectedDate || !state.selectedTime) {
    showMessage("Please select date and time.", "error");
    return;
  }

  // 🔹 5. Compute ESTIMATED totals + FIXED downpayment
const selectedServices = state.selectedServices || [];
const addons = state.selectedAddOns || [];

const estimatedTotalAmount =
  selectedServices.reduce((sum, s) => sum + (s.price || 0), 0) +
  addons.reduce((sum, a) => sum + (a.price || 0), 0);

const downpaymentAmount = FIXED_DOWNPAYMENT;

const totalDurationMinutes =
  selectedServices.reduce((sum, s) => sum + (s.durationMinutes || 0), 0) +
  addons.reduce((sum, a) => sum + (a.durationMinutes || 0), 0);


  const confirmBtn = document.getElementById('confirmBookingBtn') || document.getElementById('confirmBookingBottom');
  if (confirmBtn) confirmBtn.disabled = true;

  try {
    showMessage("Uploading receipt and submitting appointment...", "info", 5000);

    // 🔹 6. Upload receipt
    let receiptPath = null;
    if (state.receiptFile) {
      const file = state.receiptFile;
      const timestamp = Date.now();
      const cleanName = file.name.replace(/\s+/g, '_');
      const path = `receipts/${userId}/${timestamp}_${cleanName}`;

      const { data: uploadData, error: uploadError } = await supabaseClient.storage
        .from('receipts')
        .upload(path, file, { cacheControl: '3600', upsert: false });

      if (uploadError) {
        console.error(uploadError);
        showMessage("Receipt upload failed: " + uploadError.message, "error");
        if (confirmBtn) confirmBtn.disabled = false;
        return;
      }

      receiptPath = uploadData.path;
    }

    // 🔹 7. Build start datetime (Manila -> UTC ISO)
    const [hours, minutes] = timeStringTo24h(state.selectedTime).split(':').map(Number);
    const appointmentStart = new Date(`${state.selectedDate}T00:00:00+08:00`);
    appointmentStart.setHours(hours, minutes, 0, 0);

    const startIsoUTC = appointmentStart.toISOString();

    // ✅ Build endSchedule based on estimated duration
    const appointmentEnd = new Date(appointmentStart.getTime() + totalDurationMinutes * 60000);
    const endIsoUTC = appointmentEnd.toISOString();

    // 🔹 8. Build ServiceType CSV (main + addons) and readable Service string
    const selectedIds = [
      ...(state.selectedServices || []).map(s => s.id),
      ...(state.selectedAddOns || []).map(a => a.id)
    ].filter(Boolean);

    const serviceType = selectedIds.join(',');

    const serviceNames = [
      ...(state.selectedServices || []).map(s => s.name),
      ...(state.selectedAddOns || []).map(a => `Add-on: ${a.name}`)
    ].join(', ');

    // 🔹 9. Dentist mapping
    const dentistRecord = dentists.find(d => d.id === state.selectedDentist.id);
    const dentistUserAccountId = dentistRecord?.userAccountId || null;

    if (!dentistRecord) {
      showMessage("Invalid dentist selected.", "error");
      if (confirmBtn) confirmBtn.disabled = false;
      return;
    }

    const transactionId = generateTransactionId();

    // 🔹 10. Insert Appointment (Estimated Total only)
    const { data: insertedAppointments, error: insertError } = await supabaseClient
      .from('Appointment')
      .insert([{
        UserAccountID: userId,
        DentistID: dentistUserAccountId,
        ServiceType: serviceType,
        Service: serviceNames,
        AppointmentSchedule: startIsoUTC,
        endschedule: endIsoUTC,
        Status: 'Pending',
        ReceiptImage: receiptPath,
        AppointmentNotes: document.getElementById('appointmentNotes')?.value || '',
        TransactionID: transactionId,
        DownpaymentAmount: downpaymentAmount,
        TotalAmount: estimatedTotalAmount, // ✅ estimated only
        PaymentState: 'DOWNPAYMENT PENDING REVIEW'
      }])
      .select();

    if (insertError) {
      console.error(insertError);
      showMessage("Failed to save appointment: " + insertError.message, "error");
      if (confirmBtn) confirmBtn.disabled = false;
      return;
    }

    const appointmentId = insertedAppointments?.[0]?.AppointmentID;

    // 🔹 10b. Insert Billing row for downpayment
    if (appointmentId) {
      const { error: billingError } = await supabaseClient
        .from('Billing')
        .insert([{
          UserAccountID: userId,
          AppointmentID: appointmentId,
          Amount: downpaymentAmount,
          PaymentType: 'DOWNPAYMENT',
          PaymentMethod: 'GCASH',
          PaymentStatus: 'PENDING',
          DateIssued: new Date().toISOString()
        }]);

      if (billingError) {
        console.error("Failed to insert billing record:", billingError);
        showMessage("Appointment saved, but failed to record billing. Please contact the clinic.", "error");
      }
    }

    // 🔹 11. Notify secretary
    try {
      const secretaryUserId = "57199cb6-de16-42ae-a693-a919a8a08c85";
      const message = `New appointment requested by ${localStorage.getItem('userFirstName') || 'a patient'}.`;

      if (appointmentId) {
        await supabaseClient.from('Notifications').insert([{
          AppointmentID: appointmentId,
          UserAccountID: secretaryUserId,
          Message: message,
          DateSent: new Date().toISOString(),
          Status: 'Unread',
          NotificationNotes: ''
        }]);
      }
    } catch (notifError) {
      console.error("Failed to send notification to secretary:", notifError);
    }

    // 🔹 12. Success UI & reset
    showMessage("Appointment request sent successfully! Secretary will review the downpayment.", "success", 5000);

    openTransactionModal({
      transactionId,
      date: state.selectedDate,
      time: state.selectedTime,
      dentist: state.selectedDentist?.name,
      services: [
  ...selectedServices.map(s => s.name),
  ...addons.map(a => `Add-on: ${a.name}`)
],
      downpayment: downpaymentAmount
    });

setState({
  currentStep: 1,
  selectedServices: [],
  selectedAddOns: [],
  selectedDate: "",
  selectedTime: "",
  selectedDentist: null,
  receiptFile: null,
  appointmentNotes: ""
});


    const preview = document.getElementById('receiptPreview');
    if (preview) preview.innerHTML = '';

    const notes = document.getElementById('appointmentNotes');
    if (notes) notes.value = '';

    if (confirmBtn) confirmBtn.disabled = false;

  } catch (err) {
    console.error(err);
    showMessage("Unexpected error occurred while booking.", "error");
    if (confirmBtn) confirmBtn.disabled = false;
  }
};

    // Initial render
    render();
  </script>
