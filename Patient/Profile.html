<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "custom-primary": "#03555E",

        },

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
  <style>
        .bg-\[\#03555E\] { background-color: #03555E; }
        .hover\:bg-\[\#024449\]:hover { background-color: #024449; }
        .card {
            border-radius: 0.5rem;
            border: 1px solid #e5e7eb;
            background-color: white;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);

            background-color: #f3f4f6;

        .input-style {

            border: 1px solid #e5e7eb;
            border-radius: 0.375rem;
            margin-top: 0.25rem;

            outline-offset: 2px;
            border-color: #03555E;
            box-shadow: 0 0 0 1px #03555E;
        }
        .bg-gray-50-disabled {
             background-color: #f9fafb;

</head>

<body class="min-h-screen bg-gray-50">

  <div class="flex min-h-[calc(100vh-72px)]">
    <aside class="w-64 bg-custom-primary text-white flex-shrink-0">
      <nav class="p-4 space-y-1">
        <a href="Dashboard.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-solid fa-house w-5"></i>

        <a href="Booking.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-regular fa-calendar-plus w-5"></i>

        <a href="MyBooking.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">

        <a href="TreatmentRecords.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-regular fa-file-lines w-5"></i>

        <a href="Billing.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-regular fa-credit-card w-5"></i>
          <span>Billing</span>
        </a>
        <a href="notifications.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-regular fa-bell w-5"></i>
          <span>Notifications</span>
        </a>
        <a href="Profile.html" class="flex items-center gap-3 px-3 py-2 rounded-lg bg-white/10 hover:bg-custom-hover transition-colors">
          <i class="fa-regular fa-user w-5"></i>
          <span>Profile</span>
        </a>
        <a href="Settings.html" class="flex items-center gap-3 px-3 py-2 rounded-lg hover:bg-custom-hover transition-colors">
          <i class="fa-solid fa-gear w-5"></i>

        </a>

        <button onclick="logout()" class="w-full flex items-center gap-3 px-3 py-2 rounded-lg bg-red-500 hover:bg-red-600 transition-colors">
          <i class="fa-solid fa-right-from-bracket w-5"></i>
          <span class="font-medium">Logout</span>
        </button>
      </nav>
    </aside>

    <main class="flex-1 p-6">
      <h1 class="text-2xl font-bold text-gray-900">Profile</h1>
      <p class="text-gray-600 mb-6">Manage your personal information</p>

      <div class="container mx-auto px-4 py-8">
            <div class="max-w-2xl mx-auto space-y-6">
                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title flex items-center justify-between">
                            <span class="flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                                </svg>
                                Profile Picture
                            </span>
                        </h2>
                    </div>
                    <div class="card-content">
                        <div class="flex items-center gap-4">
                            <div class="w-20 h-20 bg-[#03555E] rounded-full flex items-center justify-center">
                                <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-10 h-10 text-white">
                                    <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </div>
                            <div>
                                <button class="button-style button-outline text-sm">
                                    Change Photo
                                </button>
                                <p class="text-sm text-gray-600 mt-1">JPG, PNG or GIF. Max size 2MB</p>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <h2 class="card-title flex items-center justify-between">
                            Personal Information
                            <button id="editToggle" class="button-style button-outline text-sm flex items-center">
                                <span id="editIcon">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2">
                                        <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path>
                                    </svg>
                                </span>
                                <span id="editText">Edit</span>
                            </button>
                        </h2>
                    </div>
                    <div class="card-content">
                        <form id="profileForm" class="space-y-4">
                            <div class="grid md:grid-cols-2 gap-4">
                                <div>
                                    <label for="firstName" class="text-sm font-medium leading-none">First Name</label>
                                    <input
                                        id="firstName"
                                        name="firstName"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <label for="middleName" class="text-sm font-medium leading-none">Middle Name</label>
                                    <input
                                        id="middleName"
                                        name="middleName"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <label for="lastName" class="text-sm font-medium leading-none">Last Name</label>
                                    <input
                                        id="lastName"
                                        name="lastName"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <label for="email" class="text-sm font-medium leading-none">Email</label>
                                    <input
                                        id="email"
                                        name="email"
                                        type="email"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <label for="phone" class="text-sm font-medium leading-none">Phone Number</label>
                                    <input
                                        id="phone"
                                        name="phone"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <label for="birthDate" class="text-sm font-medium leading-none">Date of Birth</label>
                                    <input
                                        id="birthDate"
                                        name="birthDate"
                                        type="date"
                                        value=""
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    />
                                </div>
                                <div>
                                    <select
                                        id="gender"
                                        name="gender"
                                        disabled
                                        class="input-style bg-gray-50-disabled"
                                    >
                                        <option value="">Select Gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mt-4">
                                <label for="address" class="text-sm font-medium leading-none">Address</label>
                                <textarea
                                    id="address"
                                    name="address"
                                    disabled
                                    class="input-style bg-gray-50-disabled h-20 resize-none"
                                ></textarea>
                            </div>
                        </form>
                    </div>
                </div>
                    <div id="messageBox"
                    class="hidden fixed bottom-6 right-6 p-4 rounded text-white font-medium shadow-lg z-50 transition-all duration-300">
                    </div>
            </div>
        </div>
    </div>

      
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
const SUPABASE_URL = "https://xpruhdgniomsyeufwhtm.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcnVoZGduaW9tc3lldWZ3aHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1ODU1MDgsImV4cCI6MjA3ODE2MTUwOH0.3obk7zsBdWOty0T_ArDUBAcepOecaeO-duVEG6IthcI"; 
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const editToggle = document.getElementById('editToggle');
const editText = document.getElementById('editText');
const editIcon = document.getElementById('editIcon');
const formInputs = document.querySelectorAll('#profileForm input, #profileForm textarea, #profileForm select');


let currentUser = null;

async function checkAuth(redirect = true) {
    console.log("🔍 Running checkAuth...");

    const storedFirstName = localStorage.getItem('userFirstName');
    const storedRole = localStorage.getItem('userRole');
    const storedEmail = localStorage.getItem('userEmail');

    console.log("📦 LocalStorage check:", { storedFirstName, storedRole, storedEmail });

    if (storedFirstName && storedRole) {
        console.log("✅ Using cached user info from localStorage");
        return { FirstName: storedFirstName, Role: storedRole, Email: storedEmail };
    }

    const { data: { session }, error: sessionError } = await supabaseClient.auth.getSession();
    if (sessionError) console.error(sessionError);

    if (!session?.user) {
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    const { data: userData, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('Email', session.user.email)
        .maybeSingle();

    if (error || !userData) {
        console.error(error || "No user data found");
        if (redirect) window.location.href = "/Login.html";
        return null;
    }

    localStorage.setItem('userFirstName', userData.FirstName);
    localStorage.setItem('userRole', userData.Role);
    localStorage.setItem('userEmail', userData.Email);
    localStorage.setItem('userId', userData.UserAccountID);

    console.log("✅ Fetched user info from Supabase:", userData);
    return userData;
}

function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

// --------------------------
// Load profile data
// --------------------------
async function loadUserProfile() {
    console.log("⏳ Loading user profile...");
    const userFromStorage = await checkAuth();
    if (!userFromStorage) return;

    // Use session.user.id if Email is missing
    let emailToFetch = userFromStorage.Email;
    if (!emailToFetch) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        emailToFetch = session?.user?.email;
    }

    const { data: fullProfile, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('Email', emailToFetch)
        .maybeSingle();

    if (error) {
        console.error("❌ Error fetching full profile:", error);
        return;
    }
    if (!fullProfile) {
        console.warn("⚠️ No full profile found");
        return;
    }

    currentUser = fullProfile;

    // Fill all form fields
    document.getElementById('firstName').value = fullProfile.FirstName || '';
    document.getElementById('middleName').value = fullProfile.MiddleName || '';
    document.getElementById('lastName').value = fullProfile.LastName || '';
    document.getElementById('email').value = fullProfile.Email || '';
    document.getElementById('phone').value = fullProfile.ContactNumber || '';
    document.getElementById('birthDate').value = fullProfile.BirthDate || '';
    document.getElementById('gender').value = fullProfile.Gender || '';
    document.getElementById('address').value = fullProfile.Address || '';

    console.log("📝 Form filled with:", fullProfile);

    // Update localStorage with full profile
    localStorage.setItem('userFirstName', fullProfile.FirstName);
    localStorage.setItem('userMiddleName', fullProfile.MiddleName);
    localStorage.setItem('userLastName', fullProfile.LastName);
    localStorage.setItem('userEmail', fullProfile.Email);
    localStorage.setItem('userRole', fullProfile.Role);
}


// --------------------------
// Edit / Save toggle
// --------------------------
const editSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"></path></svg>`;
const saveSvg = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4 mr-2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path><polyline points="17 21 17 13 7 13 7 21"></polyline><polyline points="7 3 7 8 15 8"></polyline></svg>`;
let isEditing = false;

editToggle.addEventListener('click', async () => {
    isEditing = !isEditing;

    if (isEditing) {
        editText.textContent = 'Save';
        editIcon.innerHTML = saveSvg;
        formInputs.forEach(input => {
            input.removeAttribute('disabled');
            input.classList.remove('bg-gray-50-disabled');
        });
    } else {
        editText.textContent = 'Edit';
        editIcon.innerHTML = editSvg;
        formInputs.forEach(input => {
            input.setAttribute('disabled', 'true');
            input.classList.add('bg-gray-50-disabled');
        });

        if (!currentUser) return alert("No user loaded.");

        const updatedData = {
            FirstName: document.getElementById('firstName').value,
            MiddleName: document.getElementById('middleName').value,
            LastName: document.getElementById('lastName').value,
            Email: document.getElementById('email').value,
            ContactNumber: document.getElementById('phone').value,
            BirthDate: document.getElementById('birthDate').value,
            Gender: document.getElementById('gender').value,
            Address: document.getElementById('address').value
        };

        const { error } = await supabaseClient
            .from('UserAccount')
            .update(updatedData)
            .eq('UserAccountID', currentUser.UserAccountID);

        if (error) {
            console.error(error);
            return showMessage("❌ Failed to save changes. Please try again.", "error");
        } else {
            return showMessage("✅ Changes saved successfully!", "success");
            await loadUserProfile();
        }
    }
});

// Run on page load
loadUserProfile();


// ---- Shell helpers (Dashboard-consistent) ----
async function logout() {
  try { await supabaseClient.auth.signOut(); } catch(e) {}
  localStorage.clear();
  window.location.href = "/Login.html";
}

async function loadNotifications() {
    if (localStorage.getItem("prefBellNotif") === "false") return;
  const bellBtn = document.getElementById("notifBellBtn");
  if (!bellBtn) return;

  const userId = localStorage.getItem("userId");
  if (!userId) return;

  const { data: notifications, error } = await supabaseClient
    .from("Notifications")
    .select("*")
    .eq("UserAccountID", userId)
    .eq("Status", "Unread")
    .order("DateSent", { ascending: false });

  if (error) { console.error(error); return; }

  const existingBadge = document.getElementById("notif-badge");
  if (existingBadge) existingBadge.remove();

  if (notifications && notifications.length > 0) {
    const badge = document.createElement("span");
    badge.id = "notif-badge";
    badge.textContent = notifications.length;
    badge.className = "absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full";
    bellBtn.appendChild(badge);
  }

  const prevDropdown = document.getElementById("notif-dropdown");
  if (prevDropdown) prevDropdown.remove();

  bellBtn.onclick = async () => {
    let dropdown = document.getElementById("notif-dropdown");
    if (dropdown) return dropdown.remove();

    dropdown = document.createElement("div");
    dropdown.id = "notif-dropdown";
    dropdown.className = "absolute right-4 top-[72px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50";
    dropdown.style.maxHeight = "320px";

    if (!notifications || notifications.length === 0) {
      const emptyMsg = document.createElement("div");
      emptyMsg.className = "p-4 text-gray-500 text-sm";
      emptyMsg.textContent = "No new notifications";
      dropdown.appendChild(emptyMsg);
    } else {
      notifications.forEach((n) => {
        const item = document.createElement("button");
        item.type = "button";
        item.className = "w-full text-left p-4 border-b last:border-b-0 hover:bg-gray-50 text-gray-900";
        item.textContent = n.Message;
        item.addEventListener("click", async () => {
          await supabaseClient.from("Notifications").update({ Status: "Read" }).eq("NotificationID", n.NotificationID);
          dropdown.remove();
          loadNotifications();
        });
        dropdown.appendChild(item);
      });
    }

    document.body.appendChild(dropdown);

    const onDocClick = (e) => {
      if (!dropdown.contains(e.target) && e.target !== bellBtn && !bellBtn.contains(e.target)) {
        dropdown.remove();
        document.removeEventListener("click", onDocClick);
      }
    };
    setTimeout(() => document.addEventListener("click", onDocClick), 0);
  };
}



window.addEventListener("DOMContentLoaded", async () => {
  await loadUserProfile();
  await loadNotifications();
});

  </script>
</body>
