function showMessage(message, type = "error") {
  const box = document.getElementById("messageBox");
  if (!box) return;

  // Set message text
  box.textContent = message;
  box.classList.remove("hidden");

  // Reset color classes first
  box.classList.remove("bg-red-500", "bg-green-500");

  // Apply background color based on message type
  if (type === "success") {
    box.classList.add("bg-green-500");
  } else {
    box.classList.add("bg-red-500");
  }

  // Automatically hide the message after 4 seconds
  setTimeout(() => {
    box.classList.add("hidden");
  }, 4000);
}

async function loadUserProfile() {
    console.log("⏳ Loading user profile...");
    const userFromStorage = await checkAuth();
    if (!userFromStorage) return;

    // Use session.user.id if Email is missing
    let emailToFetch = userFromStorage.Email;
    if (!emailToFetch) {
        const { data: { session } } = await supabaseClient.auth.getSession();
        emailToFetch = session?.user?.email;
    }

    const { data: fullProfile, error } = await supabaseClient
        .from('UserAccount')
        .select('*')
        .eq('Email', emailToFetch)
        .maybeSingle();

    if (error) {
        console.error("❌ Error fetching full profile:", error);
        return;
    }
    if (!fullProfile) {
        console.warn("⚠️ No full profile found");
        return;
    }

    currentUser = fullProfile;
    setProfileImage(fullProfile.ProfileImageUrl || "");
    if (fullProfile.ProfileImagePath) {
  const { data, error } = await supabaseClient
    .storage
    .from("Logo")
    .createSignedUrl(fullProfile.ProfileImagePath, 60 * 60);

  if (!error) setProfileImage(data.signedUrl);
  else setProfileImage("");
} else {
  setProfileImage("");
}

    // Fill all form fields
    document.getElementById('firstName').value = fullProfile.FirstName || '';
    document.getElementById('middleName').value = fullProfile.MiddleName || '';
    document.getElementById('lastName').value = fullProfile.LastName || '';
    document.getElementById('email').value = fullProfile.Email || '';
    document.getElementById('phone').value = fullProfile.ContactNumber || '';
    document.getElementById('birthDate').value = fullProfile.BirthDate || '';
    document.getElementById('gender').value = fullProfile.Gender || '';
    const fullAddr = fullProfile.Address || '';

    // Try to parse the exact format you used in Signup:
    // `${street}, Brgy. ${barangay}, ${city}, ${province}${zip ? ' ' + zip : ''}`
    const m = fullAddr.match(/^(.*?),\s*Brgy\.\s*(.*?),\s*(.*?),\s*(.*?)(?:\s(\d{4}))?\s*$/);

    document.getElementById('addrStreet').value = m?.[1]?.trim() || '';
    document.getElementById('addrBarangay').value = m?.[2]?.trim() || '';
    const cityVal = m?.[3]?.trim() || '';
    const provVal = m?.[4]?.trim() || '';
    document.getElementById('addrZip').value = m?.[5]?.trim() || '';
    const provinceSelect = document.getElementById("addrProvince");

    localStorage.setItem('userLastName', fullProfile.LastName);

}

function extFromName(name) {
  const m = (name || "").toLowerCase().match(/\.([a-z0-9]+)$/);
  return m ? m[1] : "png";
}

async function uploadProfilePhoto(file) {
  const userAccountId = localStorage.getItem("userId");
  if (!userAccountId) throw new Error("Missing userId");

  // auth.uid == UserAccountID in your app ✅
  const ext = (file.name.split(".").pop() || "jpg").toLowerCase();
  const path = `${userAccountId}/profile_${Date.now()}.${ext}`;

  const { error: upErr } = await supabaseClient
    .storage
    .from("Logo")
    .upload(path, file, { upsert: true, contentType: file.type || "image/*" });

  if (upErr) throw upErr;

  // save the path to UserAccount
  const { error: dbErr } = await supabaseClient
    .from("UserAccount")
    .update({ ProfileImagePath: path })
    .eq("UserAccountID", userAccountId);

  if (dbErr) throw dbErr;

  // signed url for displaying (bucket can remain private)
  const { data: signed, error: signErr } = await supabaseClient
    .storage
    .from("Logo")
    .createSignedUrl(path, 60 * 60);

  if (signErr) throw signErr;

  return signed.signedUrl;
}


function setProfileImage(url) {
  const img = document.getElementById("profileImg");
  const icon = document.getElementById("profileFallbackIcon");

  if (!img || !icon) return;

  if (!url) {
    img.classList.add("hidden");
    icon.classList.remove("hidden");
    img.src = "";
    return;
  }

  img.src = url;
  img.onload = () => {
    img.classList.remove("hidden");
    icon.classList.add("hidden");
  };
  img.onerror = () => {
    img.classList.add("hidden");
    icon.classList.remove("hidden");
  };
}

document.getElementById("btnChangePhoto")?.addEventListener("click", () => {
  document.getElementById("profileFileInput")?.click();
});

document.getElementById("profileFileInput")?.addEventListener("change", async (e) => {
  const file = e.target.files?.[0];
  if (!file) return;

  if (file.size > 2 * 1024 * 1024) {
    showMessage("❌ Max file size is 2MB.", "error");
    e.target.value = "";
    return;
  }

  try {
    showMessage("Uploading photo...", "success");
    const url = await uploadProfilePhoto(file);
    setProfileImage(url);
    showMessage("✅ Profile photo updated!", "success");
  } catch (err) {
    console.error(err);
    showMessage("❌ Upload failed. Check bucket policy/permissions.", "error");
  } finally {
    e.target.value = "";
  }
});


async function logout() {
  try { await supabaseClient.auth.signOut(); } catch(e) {}
  localStorage.clear();
  window.location.href = "/Login.html";
}

async function loadNotifications() {
    // Small delay for rendering
    await new Promise(r => setTimeout(r, 100));

    // Get bell container
    const bellContainer = document.getElementById('notifBellBtn');
    if (!bellContainer) return console.warn("Bell icon container not found");

    const bellIcon = bellContainer.querySelector('svg, i'); // after lucide, it becomes SVG
    // Attach click to the container so clicks on padding also work
    if (!bellIcon) console.warn("Bell icon not found (icon may render later)");

    const userId = localStorage.getItem('userId');
    if (!userId) return;

    // Fetch unread notifications
    const { data: notifications, error } = await supabaseClient
    .from('Notifications')
    .select(`
        NotificationID,
        Message,
        Status,
        DateSent,
        AppointmentID,
        Appointment:AppointmentID (
        AppointmentID,
        UserAccountID,
        User:UserAccountID (FirstName, LastName)
        )
    `)
    .eq('UserAccountID', userId)
    .eq('Status', 'Unread')
    .order('DateSent', { ascending: false });

    if (error) return console.error(error);

    // Remove previous badge if exists
    const existingBadge = document.getElementById('notif-badge');
    if (existingBadge) existingBadge.remove();

    if (notifications.length > 0) {
        const badge = document.createElement('span');
        badge.id = 'notif-badge';
        badge.textContent = notifications.length;
        badge.className = 'absolute -top-1 -right-1 inline-flex items-center justify-center min-w-[18px] h-[18px] px-1 text-[11px] font-bold leading-none text-white bg-red-600 rounded-full';
        bellContainer.appendChild(badge);
    }

    // Remove previous dropdown if exists
    const prevDropdown = document.getElementById('notif-dropdown');
    if (prevDropdown) prevDropdown.remove();

    bellContainer.onclick = async () => {
        let dropdown = document.getElementById('notif-dropdown');
        if (dropdown) return dropdown.remove();

        dropdown = document.createElement('div');
        dropdown.id = 'notif-dropdown';
        dropdown.className = 'absolute right-0 top-[48px] w-80 bg-white border border-gray-200 rounded-xl shadow-lg overflow-auto z-50';
        dropdown.style.maxHeight = '320px';

        if (!notifications || notifications.length === 0) {
            const emptyMsg = document.createElement('div');
            emptyMsg.className = 'p-4 text-gray-500 text-sm';
            emptyMsg.textContent = 'No new notifications';
            dropdown.appendChild(emptyMsg);
        } else {
          notifications.forEach(n => {
            const item = document.createElement('button');
            item.type = "button";
            item.className =
              'w-full text-left px-4 py-3 border-b last:border-b-0 hover:bg-gray-50 cursor-pointer text-sm text-gray-700';

            const first = n.Appointment?.User?.FirstName ?? '';
            const last  = n.Appointment?.User?.LastName ?? '';
            const patientName = `${first} ${last}`.trim() || 'Unknown Patient';

            const originalMsg = n.Message || `You have a new approved appointment for patient ${patientName}`;
            item.textContent = originalMsg.replace(/patient\s*ID\s*[a-f0-9-]{8,}/i, `patient ${patientName}`);

            item.addEventListener("click", async (e) => {
              e.stopPropagation();

              const { error: updErr } = await supabaseClient
                .from("Notifications")
                .update({ Status: "Read" })
                .eq("NotificationID", n.NotificationID);

              if (updErr) {
                console.error("Failed to mark notification as read:", updErr);
                return;
              }

              // Remove dropdown and refresh badge/list
              const dd = document.getElementById("notif-dropdown");
              if (dd) dd.remove();

              loadNotifications();
            });

            dropdown.appendChild(item);
          });

        }

        bellContainer.style.position = 'relative';
        bellContainer.appendChild(dropdown);
    };
}
