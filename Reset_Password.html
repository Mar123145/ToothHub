<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | ToothHub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .brand-bg { background-color: #03555E; }
    .brand-text { color: #03555E; }
    .brand-hover:hover { background-color: #02464e; }
  </style>
</head>
<body class="min-h-screen bg-gray-50">

  <!-- Header -->
  <header class="brand-bg text-white shadow">
    <div class="container mx-auto px-4 py-4 flex items-center">
      <div class="flex items-center gap-3">
        <div class="w-12 h-12 bg-white rounded-lg flex items-center justify-center">
          <span class="brand-text font-bold text-xl">TD</span>
        </div>
        <div>
          <h1 class="text-xl font-bold">ToothHub</h1>
          <p class="text-sm opacity-90">Happy Tooth Dae Dental Clinic</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Reset Password Form -->
  <div class="flex items-center justify-center py-16 px-4">
    <div class="w-full max-w-md">

      <div class="text-center mb-8">
        <h2 class="text-3xl font-bold brand-text mb-2">Happy Tooth Dae</h2>
        <p class="text-gray-500">Create a new password</p>
      </div>

      <div class="bg-white shadow-lg rounded-xl overflow-hidden">
        <div class="p-6">

          <h3 class="text-2xl font-bold text-center brand-text mb-6">Reset Password</h3>

          <form id="resetPasswordForm" class="space-y-4">

            <!-- New Password -->
            <div class="space-y-2">
              <label for="newPassword" class="brand-text font-medium text-sm">New Password</label>
              <input
                id="newPassword"
                type="password"
                placeholder="Enter new password"
                class="w-full h-11 px-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#03555E] focus:border-[#03555E]"
                required
              />
              <p class="text-xs text-gray-400">
                Minimum 6 characters. Use a mix of letters, numbers, and symbols for better security.
              </p>
            </div>

            <!-- Confirm Password -->
            <div class="space-y-2">
              <label for="confirmPassword" class="brand-text font-medium text-sm">Confirm Password</label>
              <input
                id="confirmPassword"
                type="password"
                placeholder="Confirm your new password"
                class="w-full h-11 px-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-[#03555E] focus:border-[#03555E]"
                required
              />
            </div>

            <!-- Submit Button -->
            <button
              id="resetSubmitBtn"
              type="submit"
              class="w-full h-11 text-base font-semibold text-white rounded-lg brand-bg brand-hover transition disabled:opacity-70 disabled:cursor-not-allowed"
            >
              Update Password
            </button>
          </form>

          <!-- Message Box -->
          <div
            id="resetMessage"
            class="hidden mt-4 rounded-lg text-sm p-3 flex items-start gap-2"
          >
            <span id="resetIcon" class="mt-0.5">ℹ️</span>
            <span id="resetText"></span>
          </div>

          <div class="text-center mt-6">
            <a href="/Login.html" class="brand-text hover:underline flex items-center justify-center gap-2 text-sm">
              <span>←</span> Back to Login
            </a>
          </div>

        </div>
      </div>

      <div class="text-center mt-8">
        <a href="/" class="brand-text hover:underline flex items-center justify-center gap-2 text-sm">
          <span>←</span> Back to Home
        </a>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://xpruhdgniomsyeufwhtm.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhwcnVoZGduaW9tc3lldWZ3aHRtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjI1ODU1MDgsImV4cCI6MjA3ODE2MTUwOH0.3obk7zsBdWOty0T_ArDUBAcepOecaeO-duVEG6IthcI";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const form = document.getElementById("resetPasswordForm");
    const passwordInput = document.getElementById("newPassword");
    const confirmInput = document.getElementById("confirmPassword");
    const messageBox = document.getElementById("resetMessage");
    const messageText = document.getElementById("resetText");
    const messageIcon = document.getElementById("resetIcon");
    const submitBtn = document.getElementById("resetSubmitBtn");

    function showMessage(text, type = "error") {
      if (!messageBox) return;
      messageText.textContent = text;
      messageBox.classList.remove("hidden");

      // Reset visual state
      messageBox.classList.remove(
        "bg-red-50",
        "text-red-700",
        "border-red-200",
        "bg-green-50",
        "text-green-700",
        "border-green-200"
      );

      if (type === "success") {
        messageBox.classList.add("bg-green-50", "text-green-700", "border", "border-green-200");
        messageIcon.textContent = "✅";
      } else {
        messageBox.classList.add("bg-red-50", "text-red-700", "border", "border-red-200");
        messageIcon.textContent = "⚠️";
      }
    }

    async function ensureRecoverySession() {
      const { data, error } = await supabaseClient.auth.getUser();
      if (error || !data?.user) {
        showMessage("Invalid or expired reset link. Please request a new one.");
        throw new Error("No recovery session");
      }
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const password = passwordInput.value.trim();
      const confirm = confirmInput.value.trim();

      if (!password || !confirm) {
        showMessage("Please fill in both password fields.");
        return;
      }
      if (password !== confirm) {
        showMessage("Passwords do not match.");
        return;
      }
      if (password.length < 6) {
        showMessage("Password should be at least 6 characters.");
        return;
      }

      submitBtn.disabled = true;
      const originalText = submitBtn.textContent;
      submitBtn.textContent = "Updating...";

      try {
        await ensureRecoverySession();

        const { error } = await supabaseClient.auth.updateUser({ password });

        if (error) {
          console.error(error);
          showMessage(error.message || "Failed to update password.");
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
          return;
        }

        showMessage("Password updated successfully! Redirecting to login...", "success");

        setTimeout(() => {
          window.location.href = "/Login.html";
        }, 1500);
      } catch (err) {
        console.error(err);
        // ensureRecoverySession already shows message on failure
        submitBtn.disabled = false;
        submitBtn.textContent = originalText;
      }
    });
  </script>
</body>
</html>
